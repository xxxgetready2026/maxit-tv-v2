/* ─────────────────────────────────────────────────────────────
   SCREEN 10c — SHORTS FEED (TikTok-style) — refondu
───────────────────────────────────────────────────────────── */
const SHORTS_FEED_COLORS = ['#1a0000','#001a00','#00001a','#1a1a00','#0d0a1a','#001a1a','#1a000d'];
const SHORTS_FEED_DATA = [
  {type:'short',idx:0},{type:'short',idx:1},{type:'short',idx:2},
  {type:'ad',   adIdx:0},
  {type:'short',idx:3},{type:'short',idx:4},{type:'short',idx:5},
  {type:'ad',   adIdx:1},
  {type:'short',idx:6},
];

const ShortsPlayer = ({userSubs,profile,onClose,onViewMore,onPaywall,onAdPage}) => {
  const [feedIdx, setFeedIdx] = useState(0);
  const [prog,    setProg]    = useState(0);
  const [playing, setPlaying] = useState(true);
  const [liked,   setLiked]   = useState({});
  const [touchY,  setTouchY]  = useState(null);
  const [adRemaining, setAdRemaining] = useState(null);
  const [arrowsVisible, setArrowsVisible] = useState(true);

  const entry = SHORTS_FEED_DATA[feedIdx] || SHORTS_FEED_DATA[0];
  const isAd  = entry.type === 'ad';
  const short = isAd ? null : SHORTS_C[entry.idx] || SHORTS_C[0];
  const ad    = isAd ? getAd('shorts', entry.adIdx) : null;
  const dur   = isAd ? 15 : (short ? parseInt(short.dur)||30 : 30);
  const bgColor = SHORTS_FEED_COLORS[entry.idx % SHORTS_FEED_COLORS.length] || '#0d0d1a';

  // Progress + auto-advance
  useEffect(()=>{
    setProg(0); setPlaying(true); setAdRemaining(isAd?15:null);
  },[feedIdx]);

  useEffect(()=>{
    if(!playing) return;
    const i = setInterval(()=>{
      setProg(p=>{ if(p>=100){ clearInterval(i); return 100; } return p+100/((dur||30)*10); });
    },100);
    return ()=>clearInterval(i);
  },[playing, dur, feedIdx]);

  useEffect(()=>{
    if(prog>=100 && feedIdx<SHORTS_FEED_DATA.length-1) setTimeout(()=>setFeedIdx(f=>Math.min(f+1,SHORTS_FEED_DATA.length-1)),400);
  },[prog]);

  useEffect(()=>{
    if(!isAd) return;
    setAdRemaining(15);
    const i=setInterval(()=>setAdRemaining(r=>{ if(r<=1){clearInterval(i);return 0;} return r-1; }),1000);
    return ()=>clearInterval(i);
  },[feedIdx]);

  useEffect(()=>{
    setArrowsVisible(true);
    const timer=setTimeout(()=>setArrowsVisible(false),3000);
    return ()=>clearTimeout(timer);
  },[feedIdx]);

  const navigate = dir => {
    const next = feedIdx + dir;
    if(next>=0 && next<SHORTS_FEED_DATA.length) setFeedIdx(next);
  };

  const handleTouchStart = e => setTouchY(e.touches[0].clientY);
  const handleTouchEnd = e => {
    if(touchY===null) return;
    const dy = touchY - e.changedTouches[0].clientY;
    if(dy>50) navigate(1);
    else if(dy<-50) navigate(-1);
    setTouchY(null);
  };

  const handleViewMore = () => {
    if(!short) return;
    const isExt = ['netflix','canal','paramount','reelshort'].includes(short.partner);
    if(isExt){
      if(userSubs.includes(short.partner)) onViewMore({type:'enabler',pid:short.partner});
      else onViewMore({type:'partner-paywall',pid:short.partner});
    } else {
      if(userSubs.includes('core')){
        if(short.seriesId){ const si=VSERIES_C.findIndex(s=>s.id===short.seriesId); onViewMore({type:'vseries',startIdx:si>=0?si:0}); }
        else onViewMore({type:'player',item:short});
      } else {
        onPaywall({partner:'core',title:short.title});
      }
    }
  };

  const badgeText = short ? (short.partner==='reelshort'?t('badge_short'):short.type==='Trailer'?t('badge_trailer'):t('badge_clip')) : '';
  const badgeColor = short ? (short.partner==='reelshort'?'#8B5CF6':short.type==='Trailer'?'#E50914':'#00C851') : '#FF6B00';

  if(isAd && ad){
    return (
      <div onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd} style={{background:'#000',height:'100%',position:'relative',overflow:'hidden'}}>
        <div style={{position:'absolute',inset:0,background:ad.bg,display:'flex',flexDirection:'column',animation:'fadeIn .3s ease-out'}}>
          {/* Skip button top */}
          <div style={{padding:'46px 16px 0',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <button onClick={onClose} style={{background:'rgba(0,0,0,.4)',border:'none',borderRadius:'50%',width:34,height:34,color:'#fff',fontSize:16,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
            <span style={{background:'rgba(0,0,0,.4)',borderRadius:8,padding:'4px 10px',fontSize:11,color:'rgba(255,255,255,.7)'}}>Pub · {adRemaining??15}s</span>
          </div>
          {/* Ad body */}
          <div onClick={()=>onAdPage&&onAdPage({ad,adType:'pre',context:'shorts'})} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',cursor:'pointer',padding:24}}>
            <div style={{width:72,height:72,borderRadius:18,background:ad.logoBg,display:'flex',alignItems:'center',justifyContent:'center',marginBottom:18}}><span style={{fontSize:24,fontWeight:900,color:'#fff'}}>{ad.logo}</span></div>
            <div style={{fontSize:24,fontWeight:800,color:'#fff',textAlign:'center',marginBottom:10}}>{ad.name}</div>
            <div style={{fontSize:15,color:'rgba(255,255,255,.85)',textAlign:'center',marginBottom:20,lineHeight:1.4}}>{ad.headline}</div>
            <div style={{background:'rgba(255,255,255,.2)',borderRadius:20,padding:'8px 20px',fontSize:12,fontWeight:600,color:'#fff'}}>En savoir plus →</div>
          </div>
          {/* Skip or wait */}
          <div style={{padding:'10px 16px 28px',display:'flex',justifyContent:'flex-end'}}>
            {(adRemaining??15)<=5
              ? <button onClick={()=>navigate(1)} style={{background:'rgba(255,255,255,.2)',border:'1px solid rgba(255,255,255,.3)',borderRadius:20,padding:'8px 18px',color:'#fff',fontSize:13,fontWeight:700,cursor:'pointer'}}>{t('skip_ad')}</button>
              : <span style={{fontSize:11,color:'rgba(255,255,255,.4)'}}>Ignorer dans {adRemaining}s</span>
            }
          </div>
          {/* Progress bar */}
          <div style={{height:2,background:'rgba(255,255,255,.15)'}}><div style={{width:`${prog}%`,height:'100%',background:'rgba(255,255,255,.6)',transition:'width .1s linear'}}/></div>
        </div>
      </div>
    );
  }

  if(!short) return null;

  return (
    <div onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd} style={{background:bgColor,height:'100%',position:'relative',overflow:'hidden'}}>
      <Thumb id={short.id} style={{width:'100%',height:'100%',position:'absolute',inset:0}}>
        <div style={{position:'absolute',inset:0,background:'linear-gradient(to top,rgba(0,0,0,.9) 0%,rgba(0,0,0,.05) 40%,transparent 60%)'}}/>
      </Thumb>

      {/* Close */}
      <button onClick={onClose} style={{position:'absolute',top:46,right:16,background:'rgba(0,0,0,.5)',border:'none',borderRadius:'50%',width:36,height:36,color:'#fff',fontSize:18,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',zIndex:5}}>✕</button>

      {/* Feed dots */}
      <div style={{position:'absolute',top:52,left:'50%',transform:'translateX(-50%)',display:'flex',gap:3,zIndex:4}}>
        {SHORTS_FEED_DATA.map((e,i)=>(
          <div key={i} onClick={()=>setFeedIdx(i)} style={{width:i===feedIdx?18:4,height:4,borderRadius:2,background:i===feedIdx?'#fff':e.type==='ad'?'rgba(255,200,0,.5)':'rgba(255,255,255,.3)',transition:'all .3s',cursor:'pointer'}}/>
        ))}
      </div>

      {/* Nav arrows */}
      <div style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',zIndex:4,display:'flex',flexDirection:'column',gap:12,opacity:arrowsVisible?0.6:0,transition:'opacity .5s',pointerEvents:arrowsVisible?'auto':'none'}}>
        {feedIdx>0 && <button onClick={()=>navigate(-1)} style={{background:'rgba(0,0,0,.4)',border:'1px solid rgba(255,255,255,.2)',borderRadius:'50%',width:38,height:38,color:'#fff',fontSize:20,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>↑</button>}
        {feedIdx<SHORTS_FEED_DATA.length-1 && <button onClick={()=>navigate(1)} style={{background:'rgba(0,0,0,.4)',border:'1px solid rgba(255,255,255,.2)',borderRadius:'50%',width:38,height:38,color:'#fff',fontSize:20,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>↓</button>}
      </div>

      {/* Content info */}
      <div style={{position:'absolute',bottom:52,left:16,right:72,zIndex:4}}>
        <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:8,flexWrap:'wrap'}}>
          <span style={{background:badgeColor,color:'#fff',fontSize:10,padding:'2px 8px',borderRadius:10,fontWeight:700}}>{badgeText}</span>
          <span style={{fontSize:11,color:'rgba(255,255,255,.55)'}}>{short.dur}</span>
        </div>
        <div style={{fontSize:17,fontWeight:700,color:'#fff',marginBottom:3}}>{short.title}</div>
        <div style={{fontSize:12,color:'rgba(255,255,255,.6)',marginBottom:12}}>{short.source}</div>
        <button onClick={handleViewMore} style={{background:'rgba(255,255,255,.15)',border:'1px solid rgba(255,255,255,.3)',borderRadius:20,padding:'7px 18px',color:'#fff',fontSize:13,fontWeight:600,cursor:'pointer',backdropFilter:'blur(4px)'}}>{t('view_more')}</button>
      </div>

      {/* Interactions */}
      <div style={{position:'absolute',bottom:58,right:14,display:'flex',flexDirection:'column',gap:18,alignItems:'center',zIndex:4}}>
        <button onClick={()=>setLiked(l=>({...l,[feedIdx]:!l[feedIdx]}))} style={{background:'none',border:'none',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:2}}>
          <span style={{fontSize:28}}>{liked[feedIdx]?'❤️':'🤍'}</span>
          <span style={{fontSize:9,color:'rgba(255,255,255,.75)'}}>{t('like')}</span>
        </button>
        <button style={{background:'none',border:'none',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:2}}>
          <span style={{fontSize:28}}>💬</span><span style={{fontSize:9,color:'rgba(255,255,255,.75)'}}>{t('com')}</span>
        </button>
        <button style={{background:'none',border:'none',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:2}}>
          <span style={{fontSize:28}}>↗️</span><span style={{fontSize:9,color:'rgba(255,255,255,.75)'}}>{t('share')}</span>
        </button>
      </div>

      {/* Time + progress */}
      <div style={{position:'absolute',bottom:24,left:16,right:16,zIndex:4}}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
          <span style={{fontSize:11,color:'rgba(255,255,255,.6)'}} onClick={()=>setPlaying(p=>!p)}>
            {playing?'⏸':'▶'} {Math.floor((prog/100)*dur)}s / {dur}s
          </span>
        </div>
        <div style={{height:2,background:'rgba(255,255,255,.2)',borderRadius:1}}><div style={{width:`${prog}%`,height:'100%',background:'#fff',borderRadius:1,transition:'width .1s linear'}}/></div>
      </div>
    </div>
  );
};

  const [coins,    setCoins]    = useState(150);
  const [notifBanner, setNotifBanner] = useState(null);

  const [screen,      setScreen]     = useState('superapp');

  const [selContent,  setSelContent] = useState(null);
  const [selPartner,  setSelPartner] = useState(null);
  const [pwItem,      setPwItem]     = useState(null);
  const [showPw,      setShowPw]     = useState(false);
  const [showManage,  setShowManage] = useState(null); // partner id
  const [vPlayerData, setVPlayerData] = useState(null); // {items, startIdx}
  const [playerDataAlert, setPlayerDataAlert] = useState(null); // null | 'low' | 'depleted'
  const [playerBackScreen, setPlayerBackScreen] = useState('detail'); // where player ← goes
  const [showDemoPanel, setShowDemoPanel] = useState(false);

  const [simNoOM, setSimNoOM] = useState(false);
  const [simAppNotInstalled, setSimAppNotInstalled] = useState({});
  const [isFullscreen, setIsFullscreen] = useState(false);
  const [miniPlayerActive, setMiniPlayerActive] = useState(false);

  // Reset state when profile changes
  useEffect(()=>{
    setUserSubs([...PROFILES[profile].subs]);
    setSubPlans({});
    setLinkedPartners({});
    setPendingDowngrades({});
    setCoins(profile==='A'?150:0);
    setNotifBanner(null);
    setShowPw(false);
    setShowManage(null);
  },[profile]);

  /* ── navigation helpers ── */
  const goContent   = item => { setSelContent(item); setPlayerBackScreen('detail'); setScreen('detail'); };
  const goPartner   = pid  => { setSelPartner(pid);  setScreen('partner'); };
  const openPw      = item => { setPwItem(item);     setShowPw(true); };
  const goFTVPlay   = item => { setSelContent(item); setPlayerBackScreen('ftvgo'); setPlayerDataAlert(null); setScreen('player'); };
  const goVeedzPlay = item => { setSelContent(item); setPlayerBackScreen('veedztv'); setPlayerDataAlert(null); setScreen('player'); };

  const onPwSubscribe = payload => {
    setShowPw(false);
    setPwItem(payload);
    setScreen('payment');
  };

  const onPayContinue = () => {
    const pid = pwItem?.partner||'core';
    const isExt = pid!=='core' && pid!=='ftvgo';

    // PPV purchase: go straight to player
    if (pwItem?.ppv) {
      setPlayerBackScreen('detail');
      setScreen('player');
      return;
    }

    // Add to subs
    setUserSubs(prev=>[...new Set([...prev,pid])]);

    // Store plan
    const op = OFFER_PLANS[pid];
    if (op) {
      let planData = {price: pwItem?.selectedPrice||pwItem?.price||0};
      if (op.type==='std')     { planData={...planData,dur:pwItem.selectedDur,durLabel:pwItem.durLabel,data:pwItem.selectedData}; }
      if (op.type==='netflix') { planData={...planData,dur:pwItem.selectedDur,durLabel:pwItem.durLabel,plan:pwItem.selectedPlan,planLabel:pwItem.planLabel,data:pwItem.selectedData}; }
      if (op.type==='reelshort' && pwItem.rsMode==='coins') { setCoins(c=>c+(pwItem.coins||0)); }
      if (op.type==='reelshort' && pwItem.rsMode==='access') { planData={...planData,mode:'access',dur:'7d',data:pwItem.selectedData}; }
      setSubPlans(prev=>({...prev,[pid]:planData}));
    }

    if (isExt) {
      if (!linkedPartners[pid]) setScreen('account-link');
      else setScreen('enabler');
    } else {
      setScreen('home');
    }
  };

  const onAccountLinked = () => {
    const pid = pwItem?.partner;
    setLinkedPartners(prev=>({...prev,[pid]:true}));
    setScreen('enabler');
  };

  const onEnablerNext  = () => {
    const pid = (pwItem?.partner)||selPartner||'netflix';
    const isExt = pid!=='core'&&pid!=='ftvgo';
    if(isExt&&simAppNotInstalled[pid]) setScreen('app-not-installed');
    else setScreen('redirect');
  };
  const onRedirectDone = () => { setScreen('home'); setPwItem(null); };

  /* ── manage offer ── */
  const onUpgrade = (pid,targetPlan) => {
    setSubPlans(prev=>({...prev,[pid]:{...targetPlan,dur:targetPlan.id?.split('_')[0],durLabel:targetPlan.durLabel,data:targetPlan.data,plan:targetPlan.planLabel?targetPlan.id?.split('_')[1]:undefined,planLabel:targetPlan.planLabel,price:targetPlan.price}}));
    setShowManage(null);
  };
  const onDowngrade = (pid,targetPlan,effectiveDate) => {
    setPendingDowngrades(prev=>({...prev,[pid]:{newLabel:targetPlan.label,effectiveDate}}));
    setShowManage(null);
  };

  const changeProfile = p => { setProfile(p); setShowSwitch(false); if(p==='C'){setScreen('superapp');} };
  const enterTV = () => { if(profile==='C') setScreen('upsell'); else setScreen('home'); };

  /* ── render ── */
  const renderMain = () => {
    switch(screen){
      case 'superapp': return <SuperApp profile={profile} onEnterTV={enterTV} onSwitch={()=>setShowSwitch(true)} onContent={goContent}/>;
      case 'home':     return <Home profile={profile} userSubs={userSubs} subPlans={subPlans} pendingDowngrades={pendingDowngrades} coins={coins}
        onBack={()=>setScreen('superapp')} onContent={goContent} onPartner={goPartner} onPaywall={openPw}
        onSwitch={()=>setShowSwitch(true)} onFTVgo={()=>setScreen('ftvgo')} onFTVPlay={goFTVPlay}
        onVeedzTV={()=>setScreen('veedztv')} onVeedzPlay={goVeedzPlay}
        onManage={pid=>{setSelPartner(pid);setShowManage(pid);}}
        onShorts={()=>setScreen('shorts')}
        onChannels={()=>setScreen('channels')}
        onSearch={()=>setScreen('search')}
        onVertical={data=>{setVPlayerData(data);setScreen('player-v');}} mood={mood}/>;
      case 'detail':   return selContent && <Detail item={selContent} userSubs={userSubs} onBack={()=>setScreen('home')} onPlay={()=>{setPlayerBackScreen('detail');setMiniPlayerActive(false);setScreen('player');}} onPaywall={openPw} miniPlayer={miniPlayerActive?selContent:null} onResume={()=>{setIsFullscreen(true);setScreen('player');}} onCloseMini={()=>setMiniPlayerActive(false)}/>;
      case 'partner':  return selPartner && <PartnerPage pid={selPartner} userSubs={userSubs} subPlans={subPlans} pendingDowngrades={pendingDowngrades}
        onBack={()=>setScreen('home')}
        onSubscribe={()=>openPw({partner:selPartner,title:PINFO[selPartner]?.name})}
        onOpen={()=>{setPwItem({partner:selPartner});setScreen('enabler');}}
        onManage={()=>setShowManage(selPartner)}/>;
      case 'ftvgo':    return <FTVgo onBack={()=>setScreen('home')} onPlay={item=>goFTVPlay(item)} userSubs={userSubs} onPaywall={openPw}/>;
      case 'veedztv':  return <VeedzTV onBack={()=>setScreen('home')} userSubs={userSubs} onPlay={item=>goVeedzPlay(item)} onPaywall={openPw}/>;
      case 'player':   return <PlayerHorizontal key={`player-${playerDataAlert}`} item={selContent||NATIVE[0]} dataAlertInit={playerDataAlert} profile={profile} noOM={simNoOM} isFullscreen={isFullscreen} onEnterFullscreen={()=>setIsFullscreen(true)} onExitFullscreen={()=>setIsFullscreen(false)} onGoToDetail={()=>{setIsFullscreen(false);setMiniPlayerActive(true);setPlayerBackScreen('detail');setScreen('detail');}} onClose={()=>{setIsFullscreen(false);setPlayerDataAlert(null);setScreen(playerBackScreen);}} onOpenPaywall={openPw} onAdPage={d=>{setAdPageData({...d,from:'player'});setScreen('ad-page');}} mood={mood} forceHungryBanner={forceHungry} forcePDP={forcePDP} forceAfter={forceAfter}/>;
      case 'payment':  return <PayConfirm item={pwItem} onContinue={onPayContinue} onBack={()=>{setShowPw(true);}}/>;
      case 'account-link': return <AccountLink pid={pwItem?.partner||'netflix'} onLinked={onAccountLinked} onBack={()=>setScreen('payment')}/>;
      case 'enabler':  return <Enabler pid={(pwItem?.partner)||selPartner||'netflix'} onNext={onEnablerNext} onCancel={()=>setScreen('payment')}/>;
      case 'redirect': return <Redirect pid={(pwItem?.partner)||selPartner||'netflix'} onFinish={onRedirectDone} onCancel={()=>setScreen('partner')}/>;
      case 'app-not-installed': return <AppNotInstalled pid={(pwItem?.partner)||selPartner||'netflix'} onBack={()=>setScreen('enabler')} onFinish={onRedirectDone}/>;
      case 'ad-page':  return adPageData && <AdPage ad={adPageData.ad} adType={adPageData.adType} context={adPageData.context} onBack={()=>setScreen(adPageData.from||'player')}/>;
      case 'channels': return <ChannelsScreen onBack={()=>setScreen('home')} onPlay={ch=>{ goFTVPlay({id:ch.id||'ftv1',title:ch.name,partner:'ftvgo',prog:0}); }}/>;
      case 'search':   return <SearchScreen onBack={()=>setScreen('home')} onContent={item=>{ setSelContent(item); setScreen('detail'); }}/>;
      case 'shorts':   return <ShortsPlayer userSubs={userSubs} profile={profile} onClose={()=>setScreen('home')} onPaywall={openPw} onAdPage={d=>{setAdPageData({...d,from:'shorts'});setScreen('ad-page');}}
        onViewMore={data=>{
          if(data.type==='enabler'){ setSelPartner(data.pid); setScreen('enabler'); }
          else if(data.type==='partner-paywall'){ openPw({partner:data.pid,title:(PINFO[data.pid]?.name||data.pid)}); }
          else if(data.type==='vseries'){ setVPlayerData({items:VSERIES_C,startIdx:data.startIdx||0}); setScreen('player-v'); }
          else if(data.type==='player'){ setSelContent({...data.item,type:data.item.type||'Short',year:2024,prog:0,synopsis:''}); setScreen('player'); }
        }}/>;
      case 'player-v': return vPlayerData && <VerticalPlayer items={vPlayerData.items} startIdx={vPlayerData.startIdx||0} profile={profile} onClose={()=>setScreen('home')} onAdPage={d=>{setAdPageData({...d,from:'player-v'});setScreen('ad-page');}}/>;
      case 'upsell':   return <Upsell
        onPaywallCore={durId=>openPw({partner:'core',title:'Max it TV',preselectedDur:durId})}
        onPartner={pid=>openPw({partner:pid,title:(PINFO[pid]?.name||pid)})}
        onExplore={()=>setScreen('home')}
        onBack={()=>setScreen('superapp')}/>;
      default: return null;
    }
  };

  return (
    <>
      {showLaunch && <LaunchScreen onSelectLang={selectLang} fading={launchFading}/>}
      {showMoodScreen && <MoodScreen onSelect={selectMood} fading={moodFading}/>}
      <div style={{opacity:showLaunch?0:1,transition:'opacity .3s ease-out',display:'flex',flexDirection:'column',alignItems:'center'}}>
        <div className={`phone${screen==='player'?' landscape':''}${isFullscreen?' fullscreen':''}`}>
          {renderMain()}
          {showPw && <Paywall item={pwItem} onClose={()=>setShowPw(false)} onSubscribe={onPwSubscribe} coins={coins}/>}
          {showSwitch && <ProfileSwitcher cur={profile} onSelect={changeProfile} onClose={()=>setShowSwitch(false)}/>}
          {showManage && <ManageOffer pid={showManage} subPlans={subPlans} pendingDowngrades={pendingDowngrades} onClose={()=>setShowManage(null)} onUpgrade={onUpgrade} onDowngrade={onDowngrade}/>}
          <NotifBanner notif={notifBanner} onDismiss={()=>setNotifBanner(null)}/>
        </div>
        <div className="qr-panel" style={{display:(screen==='player'||isFullscreen)?'none':'block'}}>
          <img src={`https://api.qrserver.com/v1/create-qr-code/?data=${encodeURIComponent(VERCEL_URL)}&size=120x120`} alt="QR" style={{width:120,height:120,display:'block',marginBottom:6}}/>
          <div style={{fontWeight:700,marginBottom:2}}>Max it TV Demo</div>
          <div style={{color:'#FF6B00',fontSize:11,fontWeight:600}}>{VERCEL_URL}</div>
        </div>
        {/* Demo panel */}
        {!isFullscreen && (()=>{
          const canSim=profile==='A'&&userSubs.includes('netflix');
          const ftvActive=screen==='player'&&selContent?.partner==='ftvgo';
          return (
            <div style={{marginTop:16,background:'#111',borderRadius:12,padding:'14px 16px',width:375,border:'1px solid #2a2a2a',display:'flex',flexDirection:'column',gap:16}}>
              {/* Max it Mood · After · Commande */}
              <div>
                <div style={{fontSize:11,color:'#555',marginBottom:10,textTransform:'uppercase',letterSpacing:1}}>⚙ {t('demo_mood_section')}</div>
                <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:10}}>
                  <button onClick={()=>{setMood(null);setShowMoodScreen(true);setMoodFading(false);}} style={{flex:'1 1 auto',padding:'10px 8px',borderRadius:10,border:'none',background:'#1a1a2a',color:'#a78bfa',fontSize:11,fontWeight:700,cursor:'pointer'}}>{t('demo_trigger_mood')}</button>
                  <button onClick={()=>{if(screen==='player'){setForceHungry(false);setTimeout(()=>setForceHungry(true),50);}}} style={{flex:'1 1 auto',padding:'10px 8px',borderRadius:10,border:'none',background:'#1a1a1a',color:screen==='player'?'#fb923c':'#555',fontSize:11,fontWeight:700,cursor:screen==='player'?'pointer':'not-allowed'}}>{t('demo_trigger_hungry')}</button>
                  <button onClick={()=>{if(screen==='player'){setForcePDP(false);setTimeout(()=>setForcePDP(true),50);}}} style={{flex:'1 1 auto',padding:'10px 8px',borderRadius:10,border:'none',background:'#1a1a1a',color:screen==='player'?'#34d399':'#555',fontSize:11,fontWeight:700,cursor:screen==='player'?'pointer':'not-allowed'}}>{t('demo_trigger_pdp')}</button>
                  <button onClick={()=>{if(screen==='player'){setForceAfter(false);setTimeout(()=>setForceAfter(true),50);}}} style={{flex:'1 1 auto',padding:'10px 8px',borderRadius:10,border:'none',background:'#1a1a1a',color:screen==='player'?'#818cf8':'#555',fontSize:11,fontWeight:700,cursor:screen==='player'?'pointer':'not-allowed'}}>{t('demo_trigger_after')}</button>
                  <button onClick={()=>{setMood(null);setShowMoodScreen(false);setMoodFading(false);setForcePDP(false);setForceHungry(false);setForceAfter(false);}} style={{flex:'1 1 auto',padding:'10px 8px',borderRadius:10,border:'none',background:'#2a1a1a',color:'#f87171',fontSize:11,fontWeight:700,cursor:'pointer'}}>{t('demo_reset_session')}</button>
                </div>
                <div style={{fontSize:10,color:'#555',marginBottom:6}}>{t('demo_mood_quick')}</div>
                <div style={{display:'flex',gap:6}}>
                  {MOOD_OPTIONS.map(m=>(
                    <button key={m.id} onClick={()=>setMood(m.id)} style={{flex:1,padding:'7px 0',borderRadius:8,border:`1.5px solid ${mood===m.id?'#FF6B00':'#2a2a2a'}`,background:'#1a1a1a',fontSize:16,cursor:'pointer'}}>{m.emoji}</button>
                  ))}
                </div>
              </div>
              {/* FTVgo data alerts — visible uniquement quand contenu FTVgo actif dans le player */}
              {ftvActive && (
                <div>
                  <div style={{fontSize:11,color:'#555',marginBottom:10,textTransform:'uppercase',letterSpacing:1}}>⚙ {t('ftv_data_section')}</div>
                  <div style={{display:'flex',gap:8}}>
                    <button onClick={()=>setPlayerDataAlert('low')} style={{flex:1,padding:'10px',borderRadius:10,border:'none',background:'#1e2a1a',color:'#f59e0b',fontSize:12,fontWeight:700,cursor:'pointer'}}>⚠️ Alerte data faible</button>
                    <button onClick={()=>setPlayerDataAlert('depleted')} style={{flex:1,padding:'10px',borderRadius:10,border:'none',background:'#2a1a1a',color:'#ef4444',fontSize:12,fontWeight:700,cursor:'pointer'}}>📵 Data épuisée</button>
                  </div>
                </div>
              )}
              {/* Orange Money toggle */}
              <div>
                <div style={{fontSize:11,color:'#555',marginBottom:10,textTransform:'uppercase',letterSpacing:1}}>⚙ Pizza — Orange Money</div>
                <div onClick={()=>setSimNoOM(v=>!v)} style={{display:'flex',alignItems:'center',gap:12,cursor:'pointer',background:'#1a1a1a',borderRadius:10,padding:'12px 14px',border:`1.5px solid ${simNoOM?'#FF6B00':'#2a2a2a'}`}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:12,fontWeight:700,color:'#fff',marginBottom:3}}>{t('pizza_no_om_toggle')}</div>
                    <div style={{fontSize:10,color:'#555',lineHeight:1.4}}>{t('pizza_no_om_sub')}</div>
                  </div>
                  <div style={{width:40,height:22,borderRadius:11,background:simNoOM?'#FF6B00':'#333',position:'relative',flexShrink:0,transition:'background .2s'}}>
                    <div style={{position:'absolute',top:2,left:simNoOM?20:2,width:18,height:18,borderRadius:'50%',background:'#fff',transition:'left .2s'}}/>
                  </div>
                </div>
              </div>
              {/* App non installée toggles */}
              <div>
                <div style={{fontSize:11,color:'#555',marginBottom:8,textTransform:'uppercase',letterSpacing:1}}>⚙ App Non Installée</div>
                <div style={{fontSize:10,color:'#555',marginBottom:8,lineHeight:1.4}}>Active avant de cliquer sur "Ouvrir" dans la page partenaire</div>
                {['netflix','canal','paramount','reelshort'].map(pid=>{
                  const labels={netflix:'Netflix',canal:'Canal+',paramount:'Paramount+',reelshort:'ReelShort'};
                  const on=!!simAppNotInstalled[pid];
                  return (
                    <div key={pid} onClick={()=>setSimAppNotInstalled(v=>({...v,[pid]:!v[pid]}))} style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer',background:'#1a1a1a',borderRadius:8,padding:'9px 12px',border:`1px solid ${on?'#FF6B00':'#222'}`,marginBottom:6}}>
                      <div style={{flex:1,fontSize:12,fontWeight:600,color:on?'#fff':'#888'}}>{labels[pid]}</div>
                      <div style={{width:32,height:16,borderRadius:8,background:on?'#FF6B00':'#333',position:'relative',flexShrink:0,transition:'background .2s'}}>
                        <div style={{position:'absolute',top:2,left:on?14:2,width:12,height:12,borderRadius:'50%',background:'#fff',transition:'left .2s'}}/>
                      </div>
                    </div>
                  );
                })}
              </div>
              {/* Netflix plan simulation */}
              <div>
                <div style={{fontSize:11,color:'#555',marginBottom:6,textTransform:'uppercase',letterSpacing:1}}>⚙ {t('sim_section')}</div>
                <div style={{fontSize:11,color:'#666',marginBottom:10,fontStyle:'italic',lineHeight:1.5}}>{t('sim_desc')}</div>
                <div style={{display:'flex',flexDirection:'column',gap:8}}>
                  <button disabled={!canSim} onClick={()=>{
                    setSubPlans(prev=>({...prev,netflix:{...prev.netflix,plan:'full',planLabel:'Full Netflix',price:5500}}));
                    setNotifBanner({title:t('notif_upgrade_title'),body:t('notif_upgrade_body')});
                  }} style={{padding:'10px 12px',borderRadius:10,border:'none',background:'#1a2a1a',color:canSim?'#4ade80':'#555',fontSize:12,fontWeight:700,cursor:canSim?'pointer':'not-allowed',opacity:canSim?1:0.4,textAlign:'left'}}>
                    <div>{t('sim_upgrade')}</div>
                    <div style={{fontSize:10,fontWeight:400,opacity:.7,marginTop:2}}>{t('sim_upgrade_sub')}</div>
                  </button>
                  <button disabled={!canSim} onClick={()=>{
                    const d=new Date(); d.setDate(d.getDate()+30);
                    const s=d.toLocaleDateString('fr-FR',{day:'numeric',month:'long'});
                    setPendingDowngrades(prev=>({...prev,netflix:{newLabel:'Medium',effectiveDate:s}}));
                    setNotifBanner({title:t('notif_downgrade_title'),body:`${t('notif_downgrade_body')} ${s}`});
                  }} style={{padding:'10px 12px',borderRadius:10,border:'none',background:'#2a1a1a',color:canSim?'#f87171':'#555',fontSize:12,fontWeight:700,cursor:canSim?'pointer':'not-allowed',opacity:canSim?1:0.4,textAlign:'left'}}>
                    <div>{t('sim_downgrade')}</div>
                    <div style={{fontSize:10,fontWeight:400,opacity:.7,marginTop:2}}>{t('sim_downgrade_sub')}</div>
                  </button>
                </div>
                {!canSim && <div style={{fontSize:10,color:'#555',marginTop:6}}>{t('sim_profA_only')}</div>}
              </div>
            </div>
          );
        })()}
      </div>
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
