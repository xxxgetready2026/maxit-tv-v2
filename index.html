<style>
  :root{
    /* ── Colors ── */
    --bg-primary:#000000;--bg-card:#1a1a1a;--bg-elevated:#111111;--bg-interactive:#2a2a2a;--bg-nav:#0d0d0d;
    --accent:#FF6B00;--badge-live:#FF6B00;--progress-content:#FF6B00;
    --text-primary:#FFFFFF;--text-secondary:#888888;--text-tertiary:#555555;
    --separator:#1e1e1e;--border-default:#333333;
    --progress-live:#FF4444;--success:#4CAF50;--bg-success:#1a4a1a;
    /* ── Typography ── */
    --font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;
    --text-size-title-screen:24px;--text-weight-title-screen:700;
    --text-size-title-section:18px;--text-weight-title-section:700;
    --text-size-card-title:13px;--text-weight-card-title:500;
    --text-size-card-subtitle:11px;--text-weight-card-subtitle:400;
    --text-size-nav-label:11px;--text-weight-nav-label:500;
    --text-size-pill:13px;--text-weight-pill:500;
    --text-size-body:14px;--text-weight-body:400;
    --text-size-caption:11px;--text-weight-caption:400;
    /* ── Spacing ── */
    --padding-horizontal:16px;--gap-cards:10px;--gap-sections:28px;
    /* ── Border radius ── */
    --radius-card:8px;--radius-pill:20px;--radius-partner-card:12px;
    --radius-sheet:20px 20px 0 0;--radius-button:12px;--radius-nav:16px 16px 0 0;--radius-avatar:50%;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  ::-webkit-scrollbar{display:none}
  *{scrollbar-width:none;-ms-overflow-style:none}
  body{background:#0d0d1f;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:var(--font-family)}
  .phone{width:375px;height:812px;background:var(--bg-primary);border-radius:44px;overflow:hidden;position:relative;flex-shrink:0;box-shadow:0 0 0 1px #555,0 0 0 4px #222,0 40px 100px rgba(0,0,0,.7);transition:width .45s cubic-bezier(.4,0,.2,1),height .45s cubic-bezier(.4,0,.2,1),border-radius .45s}
  .phone.landscape{width:812px;height:375px;border-radius:32px}
  .phone.fullscreen{position:fixed !important;top:0 !important;left:0 !important;width:100vw !important;height:100vh !important;border-radius:0 !important;box-shadow:none !important;z-index:9999}
  .qr-panel{margin-top:20px;background:#fff;border-radius:12px;padding:12px;text-align:center;font-size:11px;color:#333}
  @media(max-width:430px){body{background:var(--bg-primary);justify-content:flex-start}.phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}.qr-panel{display:none}}
  @keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes slideDown{from{transform:translateY(-60px);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes fadeOut{from{opacity:1}to{opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes ripple{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.8);opacity:0}}
  @keyframes drawCheck{from{stroke-dashoffset:80}to{stroke-dashoffset:0}}
  @keyframes confettiFall{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(220px) rotate(720deg);opacity:0}}
</style>
</head>

const ManageOffer = ({pid,subPlans,pendingDowngrades,onClose,onUpgrade,onDowngrade}) => {
  const [step,setStep] = useState('list'); // list|confirm-up|confirm-down
  const [target,setTarget] = useState(null);
  const info = PINFO[pid];
  const op = OFFER_PLANS[pid];
  const cur = subPlans[pid];
  const DAYS_LEFT = 15;
  const PERIOD = 30;

  // Build flat plan list for this service
  let allPlans = [];
  if (op?.type==='std') {
    op.durations.forEach(d=>{
      allPlans.push({id:`${d.id}_sans`,label:`${d.label} · Sans data`,  price:d.sans,durLabel:d.label,data:'sans'});
      allPlans.push({id:`${d.id}_avec`,label:`${d.label} · Avec data`,  price:d.avec,durLabel:d.label,data:'avec'});
    });
  } else if (op?.type==='netflix') {
    op.durations.forEach(d=>op.plans.forEach(pl=>{
      allPlans.push({id:`${d.id}_${pl.id}_sans`,label:`${d.label} · ${pl.label} · Sans data`,price:op.prices[d.id][pl.id].sans,durLabel:d.label,planLabel:pl.label,data:'sans'});
      allPlans.push({id:`${d.id}_${pl.id}_avec`,label:`${d.label} · ${pl.label} · Avec data`,price:op.prices[d.id][pl.id].avec,durLabel:d.label,planLabel:pl.label,data:'avec'});
    }));
  }

  const curPrice = cur?.price || 0;
  const prorata = t => Math.round((t.price-curPrice)*DAYS_LEFT/PERIOD);
  const effDate = () => { const d=new Date('2026-06-01'); d.setDate(d.getDate()+DAYS_LEFT); return d.toLocaleDateString('fr-FR',{day:'numeric',month:'long'}); };

  const confirm = () => {
    if (step==='confirm-up') onUpgrade(pid,target);
    if (step==='confirm-down') onDowngrade(pid,target,effDate());
  };

  return (
    <div onClick={onClose} style={{position:'absolute',inset:0,zIndex:700,background:'rgba(0,0,0,.8)',backdropFilter:'blur(4px)',display:'flex',flexDirection:'column',justifyContent:'flex-end'}}>
      <div onClick={e=>e.stopPropagation()} style={{background:'#111',borderRadius:'20px 20px 0 0',padding:'12px 20px 40px',animation:'slideUp .3s ease-out',maxHeight:'80%',overflowY:'auto'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',position:'relative',marginBottom:16}}>
          <div onClick={onClose} style={{width:40,height:4,background:'#333',borderRadius:2,cursor:'pointer'}}/>
          <button onClick={onClose} style={{position:'absolute',right:0,top:-8,background:'rgba(255,255,255,.1)',border:'none',borderRadius:'50%',width:28,height:28,color:'#fff',fontSize:14,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
        </div>

        {step==='list' && <>
          <div style={{fontSize:16,fontWeight:700,color:'#fff',marginBottom:4}}>Gérer mon offre {info?.name}</div>
          {cur && <div style={{fontSize:13,color:'#888',marginBottom:16}}>{t('cur_plan')} : <span style={{color:'#FF6B00',fontWeight:600}}>{planLabel(pid,cur)} — {fmt(curPrice)} XOF/mois</span></div>}

          {allPlans.filter(t=>t.price!==curPrice).map(t=>{
            const isUp = t.price>curPrice;
            const diff = prorata(t);
            return (
              <div key={t.id} onClick={()=>{setTarget(t);setStep(isUp?'confirm-up':'confirm-down');}}
                style={{background:'#1a1a1a',borderRadius:12,padding:'14px 16px',marginBottom:10,cursor:'pointer',border:'1.5px solid #2a2a2a',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div>
                  <div style={{fontSize:13,fontWeight:600,color:'#fff',marginBottom:4}}>{t.label}</div>
                  <span style={{background:isUp?'rgba(0,200,81,.15)':'rgba(245,158,11,.15)',color:isUp?'#00C851':'#f59e0b',fontSize:10,padding:'2px 8px',borderRadius:8,fontWeight:600}}>
                    {isUp?`Immédiat · prorata calculé`:`Effectif le ${effDate()}`}
                  </span>
                </div>
                <div style={{textAlign:'right'}}>
                  <div style={{fontSize:14,fontWeight:700,color:isUp?'#00C851':'#f59e0b'}}>{fmt(t.price)} XOF</div>
                  {isUp && diff>0 && <div style={{fontSize:10,color:'#888'}}>+{fmt(diff)} XOF dû</div>}
                </div>
              </div>
            );
          })}
        </>}

        {(step==='confirm-up'||step==='confirm-down') && target && (
          <div style={{animation:'fadeIn .2s ease-out'}}>
            <button onClick={()=>setStep('list')} style={{background:'none',border:'none',color:'#888',fontSize:13,cursor:'pointer',marginBottom:16,display:'flex',alignItems:'center',gap:4}}>← Retour</button>
            <div style={{fontSize:16,fontWeight:700,color:'#fff',marginBottom:20}}>
              {step==='confirm-up'?t('confirm_upgrade'):t('confirm_downgrade')}
            </div>
            <div style={{background:'#1a1a1a',borderRadius:12,padding:'16px',marginBottom:20}}>
              <div style={{fontSize:13,color:'#888',marginBottom:8}}>Nouveau plan</div>
              <div style={{fontSize:15,fontWeight:700,color:'#fff',marginBottom:6}}>{target.label}</div>
              <div style={{fontSize:18,fontWeight:700,color:'#FF6B00'}}>{fmt(target.price)} XOF/mois</div>
              {step==='confirm-up' && target.price>curPrice && (
                <>
                  <div style={{height:1,background:'#2a2a2a',margin:'12px 0'}}/>
                  <div style={{fontSize:13,color:'#aaa'}}>{t('prorata_days')} {DAYS_LEFT} {t('prorata_rest')}</div>
                  <div style={{fontSize:16,fontWeight:700,color:'#fff',marginTop:4}}>{fmt(prorata(target))} XOF dus maintenant</div>
                  {target.data==='avec' && <div style={{fontSize:11,color:'#888',marginTop:6}}>La data incluse ne change pas · Seul le prix du plan évolue</div>}
                </>
              )}
              {step==='confirm-down' && (
                <>
                  <div style={{height:1,background:'#2a2a2a',margin:'12px 0'}}/>
                  <div style={{fontSize:13,color:'#f59e0b'}}>⏬ Effectif le {effDate()} · Période en cours non remboursée</div>
                </>
              )}
            </div>
            <button onClick={confirm} style={{width:'100%',padding:'16px',borderRadius:12,border:'none',background:'#FF6B00',color:'#fff',fontSize:16,fontWeight:700,cursor:'pointer',marginBottom:10}}>
              {step==='confirm-up'?t('confirm_upgrade'):t('confirm_downgrade')}
            </button>
          </div>
        )}
      </div>
    </div>
  );
};

/* ─────────────────────────────────────────────────────────────
   SCREEN 5 — PAYWALL (multi-step)
───────────────────────────────────────────────────────────── */
const Paywall = ({item,onClose,onSubscribe,coins}) => {
  const pid = item?.partner||'core';
  const op  = OFFER_PLANS[pid];
  const info = PINFO[pid];
  const svcName = pid==='core'?'Max it TV':pid==='ftvgo'?'FTVgo':info?.name||pid;

  // PPV mode
  const ppvElig = isPPVEligible(item);
  const [ppvTab, setPpvTab] = useState('sub'); // 'sub' | 'ppv'
  const [ppvData, setPpvData] = useState('avec');
  const ppvType = getPPVType(item);
  const ppvPrices = PPV_PRICES[ppvType] || PPV_PRICES.film;
  const isPPVMode = ppvElig && ppvTab==='ppv';

  // Standard & Netflix state
  const [selDur,  setSelDur]  = useState(()=>item?.preselectedDur||op?.durations?.[op.durations.length-1]?.id||null);
  const [selPlan, setSelPlan] = useState('medium');
  const [selData, setSelData] = useState('avec');
  const [nfStep,  setNfStep]  = useState(1); // 1=dur 2=plan 3=data
  // ReelShort state
  const [rsMode,  setRsMode]  = useState('coins');
  const [rsPack,  setRsPack]  = useState('M');
  const [rsData,  setRsData]  = useState('avec');
  // Payment method
  const OM_BALANCE = 4200;
  const [payMethod, setPayMethod] = useState('dcb');
  // Upsell bundle
  const [pwStep,     setPwStep]     = useState('offer'); // 'offer' | 'upsell' | 'otp'
  const [selUpsells, setSelUpsells] = useState({});
  // OTP
  const [otpDigits,  setOtpDigits]  = useState(['','','','']);
  const [otpError,   setOtpError]   = useState(false);
  const [otpResent,  setOtpResent]  = useState(false);
  const [pendingPayload, setPendingPayload] = useState(null);
  const UPSELLS = pid==='reelshort' ? [
    {id:'data',  icon:'📶', title:'500 Mo',           price:500, sub:'Valable 24h'},
    {id:'coins', icon:'💰', title:'Coins bonus +200',  price:400, sub:'+200 coins'},
    {id:'music', icon:'🎵', title:'Music 7 jours',    price:400, sub:'Streaming musical'},
  ] : [
    {id:'data',  icon:'📶', title:'500 Mo',       price:500, sub:'Valable 24h'},
    {id:'gaming',icon:'🎮', title:'Gaming 1 jour', price:300, sub:'Accès jeux Max it'},
    {id:'music', icon:'🎵', title:'Music 7 jours', price:400, sub:'Streaming musical'},
  ];

  const getNumPrice = () => {
    if(isPPVMode) return ppvPrices[ppvData]||0;
    if(op?.type==='std'){ const d=op.durations.find(x=>x.id===selDur)||op.durations[0]; return d[selData]||0; }
    if(op?.type==='netflix'){ const d=op.durations.find(x=>x.id===selDur)||op.durations[0]; const pl=op.plans.find(x=>x.id===selPlan)||op.plans[1]; return op.prices[d.id]?.[pl.id]?.[selData]||0; }
    if(op?.type==='reelshort'){ if(rsMode==='coins'){const pk=op.packs.find(x=>x.id===rsPack)||op.packs[1];return pk.price||0;}return op.allAccess[rsData]||0; }
    return 0;
  };
  const numPrice = getNumPrice();
  const omInsufficient = numPrice > OM_BALANCE;
  const totalUpsell = UPSELLS.filter(u=>selUpsells[u.id]).reduce((s,u)=>s+u.price,0);
  const totalFinal  = numPrice + totalUpsell;

  const [addr, setAddr] = useState('Cocody, Abidjan · Côte d\'Ivoire');
  const [payMethod, setPayMethod] = useState('dcb');
  const [otpDigits, setOtpDigits] = useState(['','','','']);
  const [otpError, setOtpError] = useState(false);
  const [otpResent, setOtpResent] = useState(false);
  const [omCreated, setOmCreated] = useState(orderData?.omCreated||false);
  const [omPIN, setOmPIN] = useState('');
  const [omPINConfirm, setOmPINConfirm] = useState('');
  const [omPINError, setOmPINError] = useState(false);
  const [omOTPDigits, setOmOTPDigits] = useState(['','','','']);
  const [omOTPError, setOmOTPError] = useState(false);
  const [omOTPResent, setOmOTPResent] = useState(false);
  const [orderNum, setOrderNum] = useState(orderData?.orderNum||'');
  const [confettiActive, setConfettiActive] = useState(false);

  const DELIVERY_FEE = 500;
  const allItems = [...PIZZA_ITEMS, ...DRINK_ITEMS];
  const subtotal = allItems.reduce((s,p)=>s+(cart[p.id]||0)*p.price, 0);
  const totalWithDelivery = subtotal + DELIVERY_FEE;
  const discount20 = omCreated ? Math.round(totalWithDelivery * 0.2) : 0;
  const finalTotal = omCreated ? totalWithDelivery - discount20 : totalWithDelivery;
  const totalQty = Object.values(cart).reduce((s,q)=>s+q, 0);
  const omInsuf = OM_PIZZA_BALANCE < totalWithDelivery;

  // For confirm view, use orderData if available (reopen from banner), else internal state
  const summary = orderData || {orderNum, payMethod, omCreated, discount:discount20, finalTotal, subtotal, cartSnapshot:cart};
  const displayCart = summary.cartSnapshot || cart;

  const addItem = id => setCart(c=>({...c,[id]:(c[id]||0)+1}));
  const removeItem = id => setCart(c=>{const n={...c};if(n[id]>1)n[id]--;else delete n[id];return n;});

  useEffect(()=>{
    if(step==='om-b3'){ setConfettiActive(true); const t=setTimeout(()=>setConfettiActive(false),3000); return()=>clearTimeout(t); }
  },[step]);

  const handlePayOTP = (idx, val) => {
    const d=[...otpDigits]; d[idx]=val.replace(/\D/,'').slice(-1); setOtpDigits(d); setOtpError(false);
    if(val&&idx<3){const el=document.getElementById(`potp-${idx+1}`);if(el)el.focus();}
    if(idx===3&&d[3]){
      const code=d.join('');
      if(code==='1234'){
        const num=`MAX-${Math.floor(1000+Math.random()*9000)}`; setOrderNum(num); setStep('confirm');
        onOrderComplete&&onOrderComplete({orderNum:num,payMethod,omCreated,discount:discount20,finalTotal,subtotal,cartSnapshot:cart});
      } else { setOtpError(true); setOtpDigits(['','','','']); setTimeout(()=>{const el=document.getElementById('potp-0');if(el)el.focus();},100); }
    }
  };

  const handleOmOTP = (idx, val) => {
    const d=[...omOTPDigits]; d[idx]=val.replace(/\D/,'').slice(-1); setOmOTPDigits(d); setOmOTPError(false);
    if(val&&idx<3){const el=document.getElementById(`omotp-${idx+1}`);if(el)el.focus();}
    if(idx===3&&d[3]){
      const code=d.join('');
      if(code==='5678'){ setStep('om-b3'); }
      else { setOmOTPError(true); setOmOTPDigits(['','','','']); setTimeout(()=>{const el=document.getElementById('omotp-0');if(el)el.focus();},100); }
    }
  };

  const confirmPayment = () => {
    if(payMethod==='om'){ setOtpDigits(['','','','']); setOtpError(false); setStep('otp-pay'); }
    else {
      const num=`MAX-${Math.floor(1000+Math.random()*9000)}`; setOrderNum(num); setStep('confirm');
      onOrderComplete&&onOrderComplete({orderNum:num,payMethod,omCreated,discount:discount20,finalTotal,subtotal,cartSnapshot:cart});
    }

      <div style={{background:'rgba(255,107,0,.1)',border:'1px solid rgba(255,107,0,.3)',borderRadius:10,padding:'10px 14px',marginBottom:14}}>
        <div style={{fontSize:12,color:'#FF6B00',marginBottom:3}}>{t('pizza_discount_badge')} {fmt(discount20)} XOF</div>
        <div style={{fontSize:12,color:'#888',textDecoration:'line-through'}}>{fmt(totalWithDelivery)} XOF</div>
      </div>
    )}
    {/* DCB */}
    <div onClick={()=>setPayMethod('dcb')} style={{background:payMethod==='dcb'?'#1e1e1e':'#161616',borderRadius:12,padding:'12px 14px',marginBottom:10,cursor:'pointer',border:payMethod==='dcb'?'2px solid #FF6B00':'1.5px solid #2a2a2a',display:'flex',gap:10,alignItems:'center'}}>
      <RadioDot sel={payMethod==='dcb'}/>
      <span style={{fontSize:18}}>📶</span>
      <div style={{flex:1}}>
        <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
          <span style={{fontSize:13,fontWeight:600,color:'#fff'}}>{t('pizza_dcb_label')}</span>
          <span style={{background:'#FF6B00',color:'#fff',fontSize:10,padding:'2px 7px',borderRadius:10,fontWeight:700,flexShrink:0}}>{t('recommended')}</span>
        </div>
        <div style={{fontSize:11,color:'#888',marginTop:2}}>{t('pizza_dcb_sub')}</div>
      </div>
    </div>
    {/* Orange Money */}
    {(noOM&&!omCreated) ? (
      <div style={{background:payMethod==='om'?'#1e1e1e':'#161616',borderRadius:12,padding:'12px 14px',marginBottom:10,border:payMethod==='om'?'2px solid #FF6B00':'1.5px solid #2a2a2a',cursor:'pointer'}} onClick={()=>setPayMethod('om')}>
        <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:10}}>
          <RadioDot sel={payMethod==='om'}/>
          <div style={{width:26,height:26,borderRadius:'50%',background:'#888',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><span style={{fontSize:8,fontWeight:800,color:'#fff'}}>OM</span></div>
          <div>
            <div style={{fontSize:13,fontWeight:600,color:'#fff'}}>{t('om_label')}</div>
            <div style={{fontSize:11,color:'#888',marginTop:1}}>{t('pizza_om_no_account')}</div>
          </div>
        </div>
        <div onClick={e=>{e.stopPropagation();setPayMethod('om');setStep('om-b1');}} style={{background:'#FF6B00',borderRadius:10,padding:'10px 14px',cursor:'pointer',textAlign:'center'}}>
          <span style={{fontSize:13,fontWeight:700,color:'#fff'}}>{t('pizza_om_create_badge')}</span>
        </div>
      </div>
    ) : (
      <div onClick={()=>{if(!omInsuf)setPayMethod('om');}} style={{background:payMethod==='om'?'#1e1e1e':'#161616',borderRadius:12,padding:'12px 14px',marginBottom:10,cursor:omInsuf?'not-allowed':'pointer',border:payMethod==='om'?'2px solid #FF6B00':'1.5px solid #2a2a2a',display:'flex',gap:10,alignItems:'center',opacity:omInsuf?0.55:1}}>
        <RadioDot sel={payMethod==='om'&&!omInsuf}/>
        <div style={{width:26,height:26,borderRadius:'50%',background:'#FF6B00',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><span style={{fontSize:8,fontWeight:800,color:'#fff'}}>OM</span></div>
        <div>
          <div style={{fontSize:13,fontWeight:600,color:'#fff'}}>{t('om_label')}</div>
          {omCreated ? (
            <div style={{fontSize:11,color:'#4ade80',marginTop:1}}>✓ {t('pizza_om_welcome_sub')} · 0 XOF</div>
          ) : omInsuf ? (
            <div style={{fontSize:11,color:'#ef4444',marginTop:1}}>{t('pizza_om_insuf_label')} {fmt(OM_PIZZA_BALANCE)} {t('pizza_om_avail')}</div>
          ) : (
            <div style={{fontSize:11,color:'#888',marginTop:1}}>{t('pizza_om_balance')} {fmt(OM_PIZZA_BALANCE)} XOF</div>
          )}
        </div>
      </div>
    )}
    {/* Card */}
    <div style={{background:'#161616',borderRadius:12,padding:'12px 14px',marginBottom:18,display:'flex',gap:10,alignItems:'center',opacity:0.38,cursor:'not-allowed',border:'1.5px solid #2a2a2a'}}>
      <div style={{width:20,height:20,borderRadius:'50%',border:'2px solid #555',flexShrink:0}}/>
      <span style={{fontSize:18}}>💳</span>
      <div>
        <div style={{fontSize:13,fontWeight:600,color:'#fff'}}>{t('pizza_card_label')}</div>
        <div style={{fontSize:11,color:'#666',marginTop:1}}>{t('pizza_card_soon')}</div>
      </div>
    </div>
    <button onClick={confirmPayment}
      style={{width:'100%',padding:'15px',borderRadius:12,border:'none',background:'#FF6B00',color:'#fff',fontSize:15,fontWeight:700,cursor:'pointer'}}>
      {t('pizza_confirm_pay')} {fmt(finalTotal)} XOF
    </button>
  </>);

  /* ── STEP OTP PAYMENT ── */
  if(step==='otp-pay') return (<>
    <Handle canClose={false}/>
    <div style={{textAlign:'center',marginBottom:22}}>
      <div style={{width:48,height:48,borderRadius:'50%',background:'#FF6B00',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 12px'}}><span style={{fontSize:18,fontWeight:800,color:'#fff'}}>OM</span></div>
      <div style={{fontSize:16,fontWeight:700,color:'#fff',marginBottom:6}}>{t('pizza_otp_title')}</div>
      <div style={{fontSize:12,color:'#888'}}>{t('pizza_otp_sub')}</div>
    </div>
    <div style={{display:'flex',gap:10,justifyContent:'center',marginBottom:12}}>
      {otpDigits.map((d,i)=>(
        <input key={i} id={`potp-${i}`} type="tel" inputMode="numeric" maxLength={1} value={d} autoFocus={i===0}
          onChange={e=>handlePayOTP(i,e.target.value)}
          onKeyDown={e=>{if(e.key==='Backspace'&&!d&&i>0){const el=document.getElementById(`potp-${i-1}`);if(el)el.focus();}}}
          style={{width:56,height:64,textAlign:'center',fontSize:26,fontWeight:700,borderRadius:12,border:`2px solid ${otpError?'#ef4444':d?'#FF6B00':'#333'}`,background:'#1a1a1a',color:'#fff',outline:'none'}}/>
      ))}
    </div>
    {otpError&&<div style={{textAlign:'center',fontSize:12,color:'#ef4444',marginBottom:10}}>{t('pizza_otp_wrong')}</div>}
    <div style={{textAlign:'center',marginBottom:10}}>
      <button onClick={()=>{setOtpResent(true);setTimeout(()=>setOtpResent(false),2000);}} style={{background:'none',border:'none',color:otpResent?'#4ade80':'#FF6B00',fontSize:12,cursor:'pointer'}}>{otpResent?t('otp_resent'):t('pizza_otp_resend')}</button>
    </div>
    <div style={{textAlign:'center'}}>
      <button onClick={()=>setStep('payment')} style={{background:'none',border:'none',color:'#666',fontSize:12,cursor:'pointer',textDecoration:'underline'}}>{t('pizza_otp_change')}</button>
    </div>
  </>);

  /* ── STEP OM-B1: CREATE ACCOUNT ── */
  if(step==='om-b1') return (<>
    <Handle/>
    <button onClick={()=>setStep('payment')} style={{background:'none',border:'none',color:'#FF6B00',fontSize:13,cursor:'pointer',marginBottom:14,padding:0}}>{t('back')}</button>
    <div style={{textAlign:'center',marginBottom:22}}>
      <div style={{width:60,height:60,borderRadius:'50%',background:'#FF6B00',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 12px'}}><span style={{fontSize:22,fontWeight:900,color:'#fff'}}>OM</span></div>
      <div style={{fontSize:18,fontWeight:800,color:'#fff',marginBottom:4}}>{t('pizza_om_create_title')}</div>
      <div style={{fontSize:12,color:'#888'}}>{t('pizza_om_create_sub')}</div>
    </div>
    <div style={{marginBottom:12}}>
      <div style={{fontSize:11,color:'#666',marginBottom:5}}>Prénom + Nom</div>
      <input defaultValue="Utilisateur Max it" style={{width:'100%',background:'#1a1a1a',border:'1.5px solid #2a2a2a',borderRadius:10,padding:'12px 14px',color:'#fff',fontSize:14,outline:'none'}}/>
    </div>
    <div style={{marginBottom:12}}>
      <div style={{fontSize:11,color:'#666',marginBottom:5}}>Numéro Orange</div>
      <input defaultValue="+225 07 XX XX XX" style={{width:'100%',background:'#1a1a1a',border:'1.5px solid #2a2a2a',borderRadius:10,padding:'12px 14px',color:'#fff',fontSize:14,outline:'none'}}/>
    </div>
    <div style={{marginBottom:12}}>
      <div style={{fontSize:11,color:'#666',marginBottom:5}}>{t('pizza_om_pin_label')}</div>
      <input type="password" inputMode="numeric" maxLength={4} value={omPIN} onChange={e=>setOmPIN(e.target.value.replace(/\D/,'').slice(0,4))}
        style={{width:'100%',background:'#1a1a1a',border:'1.5px solid #2a2a2a',borderRadius:10,padding:'12px 14px',color:'#fff',fontSize:20,outline:'none',letterSpacing:8}} placeholder="••••"/>
    </div>
    <div style={{marginBottom:omPINError?6:16}}>
      <div style={{fontSize:11,color:'#666',marginBottom:5}}>{t('pizza_om_pin_confirm_label')}</div>
      <input type="password" inputMode="numeric" maxLength={4} value={omPINConfirm} onChange={e=>setOmPINConfirm(e.target.value.replace(/\D/,'').slice(0,4))}
        style={{width:'100%',background:'#1a1a1a',border:`1.5px solid ${omPINError?'#ef4444':'#2a2a2a'}`,borderRadius:10,padding:'12px 14px',color:'#fff',fontSize:20,outline:'none',letterSpacing:8}} placeholder="••••"/>
    </div>
    {omPINError&&<div style={{fontSize:12,color:'#ef4444',marginBottom:12,textAlign:'center'}}>{t('pizza_om_pin_mismatch')}</div>}
    <button onClick={()=>{
      if(omPIN!==omPINConfirm){setOmPINError(true);return;}
      setOmPINError(false); setOmOTPDigits(['','','','']); setOmOTPError(false); setStep('om-b2');
    }} disabled={omPIN.length<4||omPINConfirm.length<4}
      style={{width:'100%',padding:'15px',borderRadius:12,border:'none',background:omPIN.length>=4&&omPINConfirm.length>=4?'#FF6B00':'#2a2a2a',color:'#fff',fontSize:15,fontWeight:700,cursor:omPIN.length>=4&&omPINConfirm.length>=4?'pointer':'default'}}>
      {t('pizza_om_create_btn')}
    </button>
  </>);

  /* ── STEP OM-B2: OTP VALIDATION ── */
  if(step==='om-b2') return (<>
    <Handle canClose={false}/>
    <div style={{textAlign:'center',marginBottom:22}}>
      <div style={{fontSize:16,fontWeight:700,color:'#fff',marginBottom:6}}>{t('pizza_om_confirm_num_title')}</div>
      <div style={{fontSize:12,color:'#888',lineHeight:1.5}}>{t('pizza_om_confirm_num_sub')}</div>
    </div>
    <div style={{display:'flex',gap:10,justifyContent:'center',marginBottom:12}}>
      {omOTPDigits.map((d,i)=>(
        <input key={i} id={`omotp-${i}`} type="tel" inputMode="numeric" maxLength={1} value={d} autoFocus={i===0}
          onChange={e=>handleOmOTP(i,e.target.value)}
          onKeyDown={e=>{if(e.key==='Backspace'&&!d&&i>0){const el=document.getElementById(`omotp-${i-1}`);if(el)el.focus();}}}
          style={{width:56,height:64,textAlign:'center',fontSize:26,fontWeight:700,borderRadius:12,border:`2px solid ${omOTPError?'#ef4444':d?'#FF6B00':'#333'}`,background:'#1a1a1a',color:'#fff',outline:'none'}}/>
      ))}
    </div>
    {omOTPError&&<div style={{textAlign:'center',fontSize:12,color:'#ef4444',marginBottom:10}}>{t('pizza_otp_wrong')}</div>}
    <div style={{textAlign:'center'}}>
      <button onClick={()=>{setOmOTPResent(true);setTimeout(()=>setOmOTPResent(false),2000);}} style={{background:'none',border:'none',color:omOTPResent?'#4ade80':'#FF6B00',fontSize:12,cursor:'pointer'}}>{omOTPResent?t('otp_resent'):t('pizza_otp_resend')}</button>
    </div>
  </>);

  /* ── STEP OM-B3: WELCOME ── */
  if(step==='om-b3') return (<>
    <Handle canClose={false}/>
    <div style={{position:'relative',textAlign:'center',padding:'8px 0 22px',overflow:'hidden'}}>
      {confettiActive&&(
        <div style={{position:'absolute',inset:0,pointerEvents:'none',overflow:'hidden'}}>
          {[...Array(22)].map((_,i)=>(
            <div key={i} style={{position:'absolute',left:`${4+i*4.5}%`,top:'-10px',width:8,height:8,borderRadius:'50%',
              background:i%3===0?'#FF6B00':i%3===1?'#fff':'#FFD700',
              animation:`confettiFall ${0.8+((i*0.07)%1.2)}s linear ${i*0.09}s forwards`}}/>
          ))}
        </div>
      )}
      <div style={{width:72,height:72,borderRadius:'50%',background:'#FF6B00',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 14px'}}><span style={{fontSize:24,fontWeight:900,color:'#fff'}}>OM</span></div>
      <div style={{fontSize:20,fontWeight:800,color:'#fff',marginBottom:6}}>{t('pizza_om_welcome_title')}</div>
      <div style={{fontSize:13,color:'#888',marginBottom:16}}>{t('pizza_om_welcome_sub')}</div>
    </div>
    <div style={{background:'#FF6B00',borderRadius:12,padding:'12px 16px',marginBottom:14,textAlign:'center'}}>
      <div style={{fontSize:13,fontWeight:700,color:'#fff'}}>{t('pizza_om_welcome_badge')}</div>
    </div>
    <div style={{fontSize:14,fontWeight:700,color:'#4ade80',textAlign:'center',marginBottom:6}}>{t('pizza_om_zero_balance')}</div>
    <div style={{fontSize:11,color:'#555',textAlign:'center',marginBottom:22,lineHeight:1.5}}>{t('pizza_om_rechargeable')}</div>
    <button onClick={()=>{setOmCreated(true);setPayMethod('om');setStep('payment');}}
      style={{width:'100%',padding:'15px',borderRadius:12,border:'none',background:'#FF6B00',color:'#fff',fontSize:15,fontWeight:700,cursor:'pointer'}}>
      {t('pizza_om_use_benefit')}
    </button>
  </>);

  /* ── STEP CONFIRM ── */
  const itemsOrdered=[...PIZZA_ITEMS,...DRINK_ITEMS].filter(p=>(displayCart[p.id]||0)>0);
  const displaySubtotal = orderData ? orderData.subtotal : subtotal;
  const displayFinal = orderData ? orderData.finalTotal : finalTotal;
  const displayDiscount = orderData ? orderData.discount : discount20;
  const displayPmt = orderData ? orderData.payMethod : payMethod;
  const displayOmCreated = orderData ? orderData.omCreated : omCreated;
  const displayOrderNum = orderData ? orderData.orderNum : orderNum;

  return (<>
    <Handle canClose={false}/>
    <div style={{textAlign:'center',marginBottom:16}}>
      <div style={{fontSize:36,marginBottom:8}}>✅</div>
      <div style={{fontSize:18,fontWeight:800,color:'#fff',marginBottom:4}}>{t('pizza_confirmed_title')}</div>
      <div style={{fontSize:12,color:'#888'}}>{t('pizza_order_num')} #{displayOrderNum}</div>
    </div>
    {/* Items recap */}
    <div style={{background:'#1a1a1a',borderRadius:12,padding:'12px 14px',marginBottom:12}}>
      {itemsOrdered.map(p=>(
        <div key={p.id} style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'#ccc',marginBottom:6}}>
          <span>{p.name} × {displayCart[p.id]}</span>
          <span>{fmt(p.price*(displayCart[p.id]||0))} XOF</span>
        </div>
      ))}
      <div style={{borderTop:'1px solid #2a2a2a',marginTop:8,paddingTop:8}}>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'#888',marginBottom:4}}>
          <span>{t('pizza_subtotal')}</span><span>{fmt(displaySubtotal)} XOF</span>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'#888',marginBottom:4}}>
          <span>{t('pizza_delivery_cost')}</span><span>500 XOF</span>
        </div>
        {displayOmCreated&&displayDiscount>0&&(
          <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'#4ade80',marginBottom:4}}>
            <span>{t('pizza_discount')}</span><span>−{fmt(displayDiscount)} XOF</span>
          </div>
        )}
        <div style={{display:'flex',justifyContent:'space-between',fontSize:14,fontWeight:700,color:'#fff',marginTop:6}}>
          <span>{t('pizza_total_paid')}</span><span style={{color:'#FF6B00'}}>{fmt(displayFinal)} XOF</span>
        </div>
      </div>
      <div style={{borderTop:'1px solid #2a2a2a',marginTop:8,paddingTop:8}}>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'#555',marginBottom:4}}>
          <span>{t('pizza_pmt_method')}</span><span>{displayPmt==='dcb'?t('pizza_pmt_dcb'):t('pizza_pmt_om')}</span>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'#555'}}>
          <span>{t('pizza_address_label')}</span><span style={{textAlign:'right',maxWidth:'55%'}}>{addr}</span>
        </div>
      </div>
    </div>
    {/* Tracking */}
    <div style={{background:'#1a1a1a',borderRadius:12,padding:'14px',marginBottom:12}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
        <div style={{fontSize:12,fontWeight:700,color:'#fff'}}>{t('pizza_delivery_in')}</div>
        <div style={{fontSize:14,fontWeight:700,color:trackStep>=3?'#4ade80':'#FF6B00'}}>{trackStep>=3?t('pizza_track_step4'):`${countdown} min`}</div>
      </div>
      <div style={{height:3,background:'#2a2a2a',borderRadius:2,marginBottom:14,overflow:'hidden'}}>
        <div style={{height:'100%',background:'#FF6B00',borderRadius:2,width:`${(trackStep/3)*100}%`,transition:'width 1.5s ease-out'}}/>
      </div>
      {[0,1,2,3].map(i=>(
        <div key={i} style={{display:'flex',gap:10,alignItems:'center',marginBottom:i<3?10:0}}>
          <div style={{width:30,height:30,borderRadius:'50%',background:trackStep>i?'#4ade80':trackStep===i?'#FF6B00':'#2a2a2a',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:14,transition:'background .6s'}}>
            {trackStep>i?'✓':trackIcons[i]}
          </div>
          <div style={{flex:1}}>
            <span style={{fontSize:13,fontWeight:trackStep>=i?700:400,color:trackStep>=i?'#fff':'#555'}}>{trackLabels[i]}</span>
          </div>
          {trackStep===i&&i<3&&(
            <div style={{width:16,height:16,borderRadius:'50%',border:'2px solid #FF6B00',borderTopColor:'transparent',animation:'spin .8s linear infinite',flexShrink:0}}/>
          )}
        </div>
      ))}
      {/* Delivery map */}
      <div style={{marginTop:14,background:'#111',borderRadius:10,padding:'10px 14px',position:'relative',height:62}}>
        <div style={{position:'absolute',top:'50%',left:14,width:10,height:10,borderRadius:'50%',background:'#FF6B00',transform:'translateY(-50%)'}}/>
        <div style={{position:'absolute',top:'50%',left:26,right:26,transform:'translateY(-50%)',borderTop:'1px dashed #333'}}/>
        <div style={{position:'absolute',top:'50%',right:14,width:10,height:10,borderRadius:'50%',background:'#fff',transform:'translateY(-50%)'}}/>
        <div style={{position:'absolute',top:'50%',transform:`translateY(-65%) translateX(0)`,left:`calc(26px + ${Math.min(scooterPos,96)}% * 0.62)`,fontSize:16,opacity:trackStep>=2?1:0,transition:'left .15s linear'}}>🛵</div>
        <div style={{position:'absolute',bottom:4,left:0,right:0,textAlign:'center',fontSize:9,color:'#444'}}>{t('pizza_track_map_label')}</div>
      </div>
    </div>
    <button onClick={onClose} style={{width:'100%',padding:'15px',borderRadius:12,border:'none',background:'#2a2a2a',color:'#fff',fontSize:15,fontWeight:700,cursor:'pointer'}}>
      {t('pizza_close')}
    </button>
  </>);
};

/* ─────────────────────────────────────────────────────────────
   COMMANDE SHEET (6 étapes)
───────────────────────────────────────────────────────────── */
const OM_CMD_BALANCE = 8500;
const CommandeSheet = ({onClose,mood,noOM}) => {
  const [step,setStep]   = useState('restaurant');
  const [resto,setResto] = useState(null);
  const [cart,setCart]   = useState({});
  const [crossSel,setCrossSel] = useState({});
  const [addr,setAddr]   = useState('Cocody, Abidjan · Côte d\'Ivoire');
  const [payMethod,setPay] = useState('dcb');
  const [omCreated,setOmCreated] = useState(false);
  const [otpDig,setOtpDig] = useState(['','','','']);
  const [otpErr,setOtpErr] = useState(false);
  const [trackStep,setTrackStep] = useState(0);
  const [orderNum,setOrderNum] = useState('');
  const [countdown,setCountdown] = useState(24);
  const [scooterPos,setScooterPos] = useState(0);

  const menu      = resto ? RESTAURANT_MENUS[resto.id]||[] : [];
  const allItems  = menu.flatMap(s=>s.items);
  const crossItems= resto ? (CROSSELL[resto.id]||[]) : [];
  const subtotal  = allItems.reduce((s,it)=>s+(cart[it.id]||0)*it.price,0);
  const crossTotal= crossItems.reduce((s,it)=>s+(crossSel[it.id]?it.price:0),0);
  const totalWithDel = subtotal+crossTotal+500;
  const omInsuf   = !omCreated && totalWithDel > OM_CMD_BALANCE;
  const finalTotal= totalWithDel;
  const totalQty  = allItems.reduce((s,it)=>s+(cart[it.id]||0),0);
  const add  = id => setCart(c=>({...c,[id]:(c[id]||0)+1}));
  const rem  = id => setCart(c=>{const n={...c};if(n[id]>1)n[id]--;else delete n[id];return n;});
  const toggleCS = id => setCrossSel(c=>({...c,[id]:!c[id]}));

  useEffect(()=>{
    if(trackStep===0&&orderNum){
      const t1=setTimeout(()=>setTrackStep(1),5000);
      const t2=setTimeout(()=>setTrackStep(2),12000);
      const t3=setTimeout(()=>setTrackStep(3),22000);
      return()=>{clearTimeout(t1);clearTimeout(t2);clearTimeout(t3);};
    }
  },[orderNum]);
  useEffect(()=>{if(!orderNum)return;const i=setInterval(()=>setCountdown(c=>Math.max(0,c-1)),1000);return()=>clearInterval(i);},[orderNum]);
  useEffect(()=>{if(trackStep<2||!orderNum)return;const i=setInterval(()=>setScooterPos(p=>Math.min(100,p+1)),120);return()=>clearInterval(i);},[trackStep,orderNum]);

  const confirmPay=()=>{
    if(payMethod==='om'){setOtpDig(['','','','']);setOtpErr(false);setStep('otp');}
    else{const n=`MAX-${Math.floor(1000+Math.random()*9000)}`;setOrderNum(n);setTrackStep(0);setStep('track');}
  };
  const handleOTP=(idx,val)=>{
    const d=[...otpDig];d[idx]=val.replace(/\D/,'').slice(-1);setOtpDig(d);setOtpErr(false);
    if(val&&idx<3){const el=document.getElementById(`cotp-${idx+1}`);if(el)el.focus();}
    if(idx===3&&d[3]){
      if(d.join('')==='1234'){const n=`MAX-${Math.floor(1000+Math.random()*9000)}`;setOrderNum(n);setTrackStep(0);setStep('track');}
      else{setOtpErr(true);setOtpDig(['','','','']);setTimeout(()=>{const el=document.getElementById('cotp-0');if(el)el.focus();},100);}
    }
  };

  const Handle=()=>(
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',position:'relative',marginBottom:16}}>
      <div style={{width:40,height:4,background:'#333',borderRadius:2}}/>
      <button onClick={onClose} style={{position:'absolute',right:0,top:-8,background:'rgba(255,255,255,.1)',border:'none',borderRadius:'50%',width:28,height:28,color:'#fff',fontSize:14,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
    </div>
  );

  /* STEP 1 — Restaurant */
  if(step==='restaurant') return(<>
    <Handle/>
    <div style={{fontSize:18,fontWeight:800,color:'#fff',marginBottom:3}}>{t('cmd_where')}</div>
    <div style={{fontSize:11,color:'#888',marginBottom:18}}>{t('cmd_delivery_sub')}</div>
    <div style={{display:'flex',gap:10,overflowX:'auto',paddingBottom:8}}>
      {RESTAURANTS.map(r=>(
        <div key={r.id} onClick={()=>{setResto(r);setCart({});setStep('menu');}} style={{flexShrink:0,width:130,background:'#1a1a1a',borderRadius:14,padding:'14px 12px',cursor:'pointer',textAlign:'center',border:'1.5px solid #2a2a2a'}}>
          <div style={{fontSize:36,marginBottom:6}}>{r.emoji}</div>
          <div style={{fontSize:12,fontWeight:700,color:'#fff',marginBottom:2}}>{r.name}</div>
          <div style={{fontSize:10,color:'#777',marginBottom:6}}>{r.sub}</div>
          <div style={{display:'flex',justifyContent:'center',gap:6,fontSize:10,color:'#aaa'}}>
            <span>⭐{r.rating}</span><span>·</span><span>{r.delay} min</span>
          </div>
        </div>
      ))}
    </div>
  </>);

  /* STEP 2 — Menu */
  if(step==='menu') return(<>
    <Handle/>
    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
      <span style={{fontSize:28}}>{resto.emoji}</span>
      <div>
        <div style={{fontSize:16,fontWeight:800,color:'#fff'}}>{resto.name}</div>
        <div style={{fontSize:11,color:'#777'}}>⭐{resto.rating} · {resto.delay} min</div>
      </div>
    </div>
    {menu.map(sec=>(
      <div key={sec.section} style={{marginBottom:16}}>
        <div style={{fontSize:11,fontWeight:700,color:'#666',textTransform:'uppercase',letterSpacing:1,marginBottom:8}}>{sec.section}</div>
        {sec.items.map(it=>{const qty=cart[it.id]||0;return(
          <div key={it.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8,padding:'10px 12px',background:'#1a1a1a',borderRadius:10}}>
            <div><div style={{fontSize:13,fontWeight:600,color:'#fff'}}>{it.name}</div><div style={{fontSize:12,color:'#FF6B00',fontWeight:700}}>{fmt(it.price)} XOF</div></div>
            <div style={{display:'flex',alignItems:'center',gap:6}}>
              {qty>0&&<button onClick={()=>rem(it.id)} style={{width:26,height:26,borderRadius:'50%',background:'#2a2a2a',border:'none',color:'#fff',fontSize:14,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>−</button>}
              {qty>0&&<span style={{fontSize:13,fontWeight:700,color:'#fff',minWidth:14,textAlign:'center'}}>{qty}</span>}
              <button onClick={()=>add(it.id)} style={{width:26,height:26,borderRadius:'50%',background:'#FF6B00',border:'none',color:'#fff',fontSize:16,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>+</button>
            </div>
          </div>
        );})}
      </div>
    ))}
    <div style={{display:'flex',justifyContent:'space-between',padding:'10px 0',borderTop:'1px solid #1e1e1e',marginBottom:8}}>
      <span style={{fontSize:13,color:'#888'}}>Total <span style={{color:'#FF6B00',fontWeight:700}}>{fmt(subtotal)} XOF</span></span>
      <span style={{fontSize:11,color:'#555'}}>{totalQty} article(s)</span>
    </div>
    <button onClick={()=>{if(totalQty>0)setStep('crossell');}} disabled={totalQty===0}
      style={{width:'100%',padding:'14px',borderRadius:12,border:'none',background:totalQty>0?'#FF6B00':'#2a2a2a',color:'#fff',fontSize:14,fontWeight:700,cursor:totalQty>0?'pointer':'default'}}>
      {totalQty===0?'Choisir au moins un article':'Continuer →'}
    </button>
  </>);

  /* STEP 3 — Cross-sell */
  if(step==='crossell') return(<>
    <Handle/>
    <div style={{fontSize:17,fontWeight:800,color:'#fff',marginBottom:2}}>{t('cmd_crossell_title')}</div>
    <div style={{fontSize:11,color:'#888',marginBottom:18}}>{t('cmd_crossell_sub')}</div>
    {crossItems.map(it=>{const on=!!crossSel[it.id];return(
      <div key={it.id} onClick={()=>toggleCS(it.id)} style={{display:'flex',alignItems:'center',gap:12,marginBottom:10,padding:'12px 14px',background:'#1a1a1a',borderRadius:12,cursor:'pointer',border:`1.5px solid ${on?'#FF6B00':'#2a2a2a'}`}}>
        <span style={{fontSize:28}}>{it.emoji}</span>
        <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600,color:'#fff'}}>{it.name}</div><div style={{fontSize:12,color:'#FF6B00',fontWeight:700}}>+{fmt(it.price)} XOF</div></div>
        <div style={{width:22,height:22,borderRadius:'50%',border:`2px solid ${on?'#FF6B00':'#555'}`,background:on?'#FF6B00':'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{on&&<span style={{fontSize:12,color:'#fff'}}>✓</span>}</div>
      </div>
    );})}
    <div style={{display:'flex',justifyContent:'space-between',padding:'10px 0',borderTop:'1px solid #1e1e1e',margin:'8px 0'}}>
      <span style={{fontSize:13,color:'#888'}}>Total <span style={{color:'#FF6B00',fontWeight:700}}>{fmt(subtotal+crossTotal)} XOF</span></span>
    </div>
    <button onClick={()=>setStep('address')} style={{width:'100%',padding:'14px',borderRadius:12,border:'none',background:'#FF6B00',color:'#fff',fontSize:14,fontWeight:700,cursor:'pointer',marginBottom:10}}>Continuer →</button>
    <button onClick={()=>setStep('address')} style={{background:'none',border:'none',color:'#666',fontSize:12,cursor:'pointer',width:'100%',textAlign:'center'}}>{t('cmd_crossell_skip')}</button>
  </>);

  /* STEP 4 — Address */
  if(step==='address') return(<>
    <Handle/>
    <div style={{fontSize:17,fontWeight:800,color:'#fff',marginBottom:16}}>{t('cmd_address_title')}</div>
    <div style={{background:'#1a1a1a',borderRadius:12,padding:'12px 14px',marginBottom:14,border:'1.5px solid #2a2a2a'}}>
      <div style={{fontSize:10,color:'#666',marginBottom:5}}>Adresse de livraison</div>
      <input value={addr} onChange={e=>setAddr(e.target.value)} style={{width:'100%',background:'none',border:'none',color:'#fff',fontSize:13,fontWeight:600,outline:'none'}}/>
    </div>
    <div style={{fontSize:13,color:'#888',marginBottom:6,display:'flex',justifyContent:'space-between'}}><span>Délai estimé</span><span style={{color:'#fff',fontWeight:600}}>{resto.delay}-{resto.delay+10} min</span></div>
    <div style={{fontSize:13,color:'#888',marginBottom:6,display:'flex',justifyContent:'space-between'}}><span>{t('cmd_delivery_fee')}</span><span style={{color:'#FF6B00',fontWeight:700}}>500 XOF</span></div>
    <div style={{fontSize:14,fontWeight:700,color:'#fff',display:'flex',justifyContent:'space-between',padding:'10px 0',borderTop:'1px solid #1e1e1e',marginTop:6,marginBottom:16}}>
      <span>Total</span><span style={{color:'#FF6B00'}}>{fmt(totalWithDel)} XOF</span>
    </div>
    <button onClick={()=>setStep('payment')} style={{width:'100%',padding:'14px',borderRadius:12,border:'none',background:'#FF6B00',color:'#fff',fontSize:14,fontWeight:700,cursor:'pointer'}}>Confirmer l'adresse →</button>
  </>);

  /* STEP 5 — Payment */
  if(step==='payment') return(<>
    <Handle/>
    <div style={{fontSize:17,fontWeight:800,color:'#fff',marginBottom:16}}>Payer · {fmt(finalTotal)} XOF</div>
    {/* DCB */}
    <div onClick={()=>setPay('dcb')} style={{background:payMethod==='dcb'?'#1e1e1e':'#161616',borderRadius:12,padding:'12px 14px',marginBottom:10,cursor:'pointer',border:payMethod==='dcb'?'2px solid #FF6B00':'1.5px solid #2a2a2a',display:'flex',gap:10,alignItems:'center'}}>
      <div style={{width:20,height:20,borderRadius:'50%',border:`2px solid ${payMethod==='dcb'?'#FF6B00':'#555'}`,background:payMethod==='dcb'?'#FF6B00':'transparent',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}}>{payMethod==='dcb'&&<div style={{width:8,height:8,borderRadius:'50%',background:'#fff'}}/>}</div>
      <span style={{fontSize:18}}>📶</span>
      <div style={{flex:1}}><div style={{display:'flex',alignItems:'center',gap:8}}><span style={{fontSize:13,fontWeight:600,color:'#fff'}}>Facturé sur ma ligne Orange</span><span style={{background:'#FF6B00',color:'#fff',fontSize:10,padding:'2px 7px',borderRadius:10,fontWeight:700}}>{t('recommended')}</span></div><div style={{fontSize:11,color:'#888',marginTop:1}}>Déduit de ton crédit ou facture mensuelle</div></div>
    </div>
    {/* OM */}
    {noOM&&!omCreated ? (
      <div style={{background:'#161616',borderRadius:12,padding:'12px 14px',marginBottom:10,border:'1.5px solid #2a2a2a'}}>
        <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:10}}>
          <div style={{width:20,height:20,borderRadius:'50%',border:'2px solid #555',flexShrink:0}}/>
          <div style={{width:26,height:26,borderRadius:'50%',background:'#888',display:'flex',alignItems:'center',justifyContent:'center'}}><span style={{fontSize:8,fontWeight:800,color:'#fff'}}>OM</span></div>
          <div><div style={{fontSize:13,fontWeight:600,color:'#fff'}}>Orange Money</div><div style={{fontSize:11,color:'#888',marginTop:1}}>Tu n'as pas encore de compte Orange Money</div></div>
        </div>
        <div onClick={()=>{setOmCreated(true);setPay('om');}} style={{background:'#FF6B00',borderRadius:10,padding:'10px 14px',cursor:'pointer',textAlign:'center'}}>
          <span style={{fontSize:13,fontWeight:700,color:'#fff'}}>🎁 Créer mon compte · -20% sur cette commande</span>
        </div>
      </div>
    ) : (
      <div onClick={()=>{if(!omInsuf)setPay('om');}} style={{background:payMethod==='om'?'#1e1e1e':'#161616',borderRadius:12,padding:'12px 14px',marginBottom:10,cursor:omInsuf?'not-allowed':'pointer',border:payMethod==='om'?'2px solid #FF6B00':'1.5px solid #2a2a2a',display:'flex',gap:10,alignItems:'center',opacity:omInsuf?0.5:1}}>
        <div style={{width:20,height:20,borderRadius:'50%',border:`2px solid ${payMethod==='om'&&!omInsuf?'#FF6B00':'#555'}`,background:payMethod==='om'&&!omInsuf?'#FF6B00':'transparent',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}}>{payMethod==='om'&&!omInsuf&&<div style={{width:8,height:8,borderRadius:'50%',background:'#fff'}}/>}</div>
        <div style={{width:26,height:26,borderRadius:'50%',background:'#FF6B00',display:'flex',alignItems:'center',justifyContent:'center'}}><span style={{fontSize:8,fontWeight:800,color:'#fff'}}>OM</span></div>
        <div>
          <div style={{fontSize:13,fontWeight:600,color:'#fff'}}>Orange Money</div>
          {omCreated?<div style={{fontSize:11,color:'#4ade80',marginTop:1}}>✓ Compte créé · 0 XOF</div>:omInsuf?<div style={{fontSize:11,color:'#ef4444',marginTop:1}}>Solde insuffisant · {fmt(OM_CMD_BALANCE)} XOF disponibles</div>:<div style={{fontSize:11,color:'#888',marginTop:1}}>Solde disponible : {fmt(OM_CMD_BALANCE)} XOF</div>}
        </div>
      </div>
    )}
    <div style={{background:'#161616',borderRadius:12,padding:'12px 14px',marginBottom:18,display:'flex',gap:10,alignItems:'center',opacity:0.38,cursor:'not-allowed',border:'1.5px solid #2a2a2a'}}>
      <div style={{width:20,height:20,borderRadius:'50%',border:'2px solid #555',flexShrink:0}}/>
      <span style={{fontSize:18}}>💳</span>
      <div><div style={{fontSize:13,fontWeight:600,color:'#fff'}}>Carte bancaire</div><div style={{fontSize:11,color:'#666',marginTop:1}}>Bientôt disponible</div></div>
    </div>
    <button onClick={confirmPay} style={{width:'100%',padding:'14px',borderRadius:12,border:'none',background:'#FF6B00',color:'#fff',fontSize:14,fontWeight:700,cursor:'pointer'}}>
      Confirmer · {fmt(finalTotal)} XOF
    </button>
  </>);

  /* OTP */
  if(step==='otp') return(<>
    <Handle/>
    <div style={{textAlign:'center',marginBottom:20}}>
      <div style={{width:48,height:48,borderRadius:'50%',background:'#FF6B00',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 12px'}}><span style={{fontSize:16,fontWeight:800,color:'#fff'}}>OM</span></div>
      <div style={{fontSize:15,fontWeight:700,color:'#fff',marginBottom:6}}>Confirme ton paiement Orange Money</div>
      <div style={{fontSize:12,color:'#888'}}>Code à 4 chiffres envoyé au +225 07 XX XX XX</div>
    </div>
    <div style={{display:'flex',gap:10,justifyContent:'center',marginBottom:10}}>
      {otpDig.map((d,i)=>(
        <input key={i} id={`cotp-${i}`} maxLength={1} value={d} onChange={e=>handleOTP(i,e.target.value)}
          style={{width:52,height:56,borderRadius:12,background:'#1a1a1a',border:`2px solid ${otpErr?'#ef4444':d?'#FF6B00':'#2a2a2a'}`,color:'#fff',fontSize:22,fontWeight:700,textAlign:'center',outline:'none'}}/>
      ))}
    </div>
    {otpErr&&<div style={{textAlign:'center',fontSize:12,color:'#ef4444',marginBottom:8}}>Code incorrect · Réessaie (utilise 1234)</div>}
    <div style={{textAlign:'center',fontSize:12,color:'#666',marginBottom:16}}>Indice démo : 1234</div>
    <button onClick={()=>setStep('payment')} style={{background:'none',border:'none',color:'#FF6B00',fontSize:12,cursor:'pointer',width:'100%'}}>Changer de moyen de paiement</button>
  </>);

  /* TRACK */
  if(step==='track') return(<>
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',position:'relative',marginBottom:12}}>
      <div style={{width:40,height:4,background:'#333',borderRadius:2}}/>
    </div>
    {trackStep<3 ? (
      <>
        <div style={{textAlign:'center',marginBottom:16}}>
          <div style={{fontSize:14,fontWeight:700,color:'#fff',marginBottom:2}}>{t('pizza_confirmed_title')}</div>
          <div style={{fontSize:11,color:'#888'}}>#{orderNum}</div>
        </div>
        {[t('pizza_track_step1'),t('pizza_track_step2'),t('pizza_track_step3'),t('pizza_track_step4')].map((lb,i)=>(
          <div key={i} style={{display:'flex',gap:10,alignItems:'center',marginBottom:10,opacity:trackStep>=i?1:0.3}}>
            <div style={{width:28,height:28,borderRadius:'50%',background:trackStep>=i?'#FF6B00':'#2a2a2a',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,flexShrink:0}}>
              {trackStep>i?'✓':['✅','🍕','🛵','🎉'][i]}
            </div>
            <div style={{fontSize:13,fontWeight:trackStep===i?700:500,color:trackStep>=i?'#fff':'#555'}}>{lb}</div>
          </div>
        ))}
        {trackStep>=2&&(
          <div style={{background:'#1a1a1a',borderRadius:12,height:60,position:'relative',overflow:'hidden',margin:'10px 0',border:'1px solid #2a2a2a'}}>
            <div style={{position:'absolute',top:'50%',transform:'translateY(-50%)',left:`${Math.min(scooterPos,85)}%`,transition:'left .5s',fontSize:22}}>🛵</div>
            <div style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',fontSize:11,color:'#888'}}>📍</div>
          </div>
        )}
        <div style={{textAlign:'center',fontSize:12,color:'#888',marginTop:8}}>Livraison dans {countdown} min</div>
      </>
    ) : (
      <>
        <div style={{textAlign:'center',marginBottom:20}}>
          <div style={{fontSize:52,marginBottom:8}}>🎉</div>
          <div style={{fontSize:18,fontWeight:800,color:'#fff',marginBottom:4}}>Livré !</div>
          <div style={{fontSize:12,color:'#888'}}>Commande #{orderNum} · Bon appétit !</div>
        </div>
        <button onClick={onClose} style={{width:'100%',padding:'14px',borderRadius:12,border:'none',background:'#2a2a2a',color:'#fff',fontSize:14,fontWeight:700,cursor:'pointer'}}>Fermer</button>
      </>
    )}
  </>);

  return null;
};

    romance:  {text:'🍫 Une envie de chocolat ? · Livraison dessert · 15 min'},

    bonne_humeur:{text:'🍦 Une glace pour célébrer ? · Pack 3 parfums · 15 min'},
  };
  const cfg = configs[mood]||{text:'🍬 Une envie sucrée ? · Desserts livrés · À partir de 800 XOF'};
  return (
    <div style={{position:'absolute',bottom:108,left:12,right:12,zIndex:25,background:'rgba(0,0,0,.9)',borderRadius:12,padding:'10px 12px',border:'1.5px solid #FF6B00',animation:'slideUp .3s ease-out'}}>
      <div style={{fontSize:12,color:'#fff',marginBottom:8,lineHeight:1.4}}>{cfg.text}</div>
      <div style={{display:'flex',gap:8}}>
        <button onClick={onOrder} style={{flex:1,padding:'7px',borderRadius:8,border:'none',background:'#FF6B00',color:'#fff',fontSize:12,fontWeight:700,cursor:'pointer'}}>{t('pdp_order')}</button>
        <button onClick={onDismiss} style={{flex:1,padding:'7px',borderRadius:8,border:'none',background:'#2a2a2a',color:'#888',fontSize:12,cursor:'pointer'}}>{t('cmd_no')} ✕</button>
      </div>
    </div>
  );
};

const PlayerHorizontal = ({item,onClose,dataAlertInit,onOpenPaywall,profile,onAdPage,noOM,isFullscreen,onEnterFullscreen,onExitFullscreen,onGoToDetail,mood,forceHungryBanner,forcePDP,forceAfter}) => {
  const [playing,     setPlaying]     = useState(false);
  const [prog,        setProg]        = useState(item?.prog||0);
  const [hungryBanner,  setHungryBanner]  = useState(false);
  const [hungryDismissed,setHungryDismissed]=useState(false);
  const [commandeSheet, setCommandeSheet] = useState(false);
  const [pdpDismissed,  setPdpDismissed]  = useState(false);
  const [showPDP,       setShowPDP]       = useState(false);
  const [showAfter,     setShowAfter]     = useState(false);
  const [afterDismissed,setAfterDismissed]=useState(false);
  // legacy pizza tracking banner (for compat)
  const [pizzaOrderData,setPizzaOrderData]= useState(null);
  const [pizzaTrackStep,setPizzaTrackStep]= useState(0);
  const [pizzaBanner,   setPizzaBanner]   = useState(false);
  const [pizzaCountdown,setPizzaCountdown]= useState(24);
  const [pizzaScooterPos,setPizzaScooterPos]=useState(0);
  const [dataAlert,   setDataAlert]   = useState(dataAlertInit||null);
  const [dataSheet,   setDataSheet]   = useState(false);
  const [dataTopupDone,setDataTopupDone] = useState(false);
  const [savedProg,   setSavedProg]   = useState(null);
  // Ad states
  const showAds = shouldShowAds(profile, item);
  const adCtx   = AD_CTX(item);
  const [adPhase,     setAdPhase]     = useState(showAds?'pre':null); // null|'pre'|'mid'|'post'
  const [adRemaining, setAdRemaining] = useState(showAds?15:0);
  const [midFired,    setMidFired]    = useState(false);

  const isFTV = item?.partner==='ftvgo';
  const TOTAL_SEC = 96;
  const cur=Math.floor((prog/100)*TOTAL_SEC);
  const fmtT = m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
  const pizzaBannerTexts=[t('pizza_banner_received'),t('pizza_banner_preparing'),t('pizza_banner_route'),t('pizza_banner_delivered')];

  // Pre-roll countdown
  useEffect(()=>{
    if(adPhase!=='pre') return;
    setAdRemaining(15);
    const i=setInterval(()=>setAdRemaining(r=>{ if(r<=1){clearInterval(i);return 0;} return r-1; }),1000);
    return ()=>clearInterval(i);
  },[adPhase]);

  // Mid/post-roll countdown
  useEffect(()=>{
    if(adPhase!=='mid'&&adPhase!=='post') return;
    const dur = adPhase==='mid'?10:10;
    setAdRemaining(dur);
    const i=setInterval(()=>setAdRemaining(r=>{
      if(r<=1){ clearInterval(i); if(adPhase==='mid'){setAdPhase(null);setPlaying(true);} else {setAdPhase(null);} return 0; }
      return r-1;
    }),1000);
    return ()=>clearInterval(i);
  },[adPhase]);

  useEffect(()=>{if(dataAlert==='depleted') setPlaying(false);},[dataAlert]);
  useEffect(()=>{
    if(!playing||adPhase) return;
    const i=setInterval(()=>setProg(p=>{
      if(p>=100){clearInterval(i);return 100;}
      return p+(100/(TOTAL_SEC*10));
    }),100);
    return ()=>clearInterval(i);
  },[playing,adPhase]);

  // Mid-roll trigger at 50%
  useEffect(()=>{
    if(showAds&&!midFired&&prog>=50){
      setMidFired(true); setPlaying(false); setAdPhase('mid');
    }
  },[prog,midFired,showAds]);

  // Post-roll at 100%
  useEffect(()=>{
    if(prog>=100&&showAds&&adPhase===null){ setPlaying(false); setAdPhase('post'); }
    else if(prog>=100&&!showAds){ setTimeout(onClose,600); }
  },[prog,showAds]);

  // Hungry banner after 10s (mood-aware)
  useEffect(()=>{const t=setTimeout(()=>{if(!hungryDismissed)setHungryBanner(true);},10000);return()=>clearTimeout(t);},[]);
  // Force triggers from demo panel
  useEffect(()=>{if(forceHungryBanner)setHungryBanner(true);},[forceHungryBanner]);
  useEffect(()=>{if(forcePDP)setShowPDP(true);},[forcePDP]);
  useEffect(()=>{if(forceAfter)setShowAfter(true);},[forceAfter]);
  // After card at 95%
  useEffect(()=>{if(prog>=95&&!afterDismissed&&!showAfter)setShowAfter(true);},[prog]);
  // Post-delivery push (15s after trackStep===3)
  useEffect(()=>{
    if(pizzaTrackStep===3&&!pdpDismissed){const t=setTimeout(()=>setShowPDP(true),15000);return()=>clearTimeout(t);}
  },[pizzaTrackStep]);

  // Pizza order tracking
  useEffect(()=>{
    if(!pizzaOrderData) return;
    const t1=setTimeout(()=>setPizzaTrackStep(1),6000);
    const t2=setTimeout(()=>setPizzaTrackStep(2),14000);
    const t3=setTimeout(()=>{setPizzaTrackStep(3);setTimeout(()=>setPizzaBanner(false),3000);},24000);
    return()=>{clearTimeout(t1);clearTimeout(t2);clearTimeout(t3);};
  },[pizzaOrderData]);

  useEffect(()=>{
    if(!pizzaOrderData) return;
    const i=setInterval(()=>setPizzaCountdown(c=>Math.max(0,c-1)),1000);
    return()=>clearInterval(i);
  },[pizzaOrderData]);

  useEffect(()=>{
    if(!pizzaOrderData||pizzaTrackStep<2) return;
    setPizzaScooterPos(0);
    const i=setInterval(()=>setPizzaScooterPos(p=>Math.min(100,p+1)),100);
    return()=>clearInterval(i);
  },[pizzaOrderData,pizzaTrackStep]);

  const handleDataTopup = () => {
    setDataSheet(false);
    setDataTopupDone(true);
    if(dataAlert==='depleted' && savedProg!==null) setProg(savedProg);
    setDataAlert(null);
    setPlaying(true);
    setTimeout(()=>setDataTopupDone(false),2000);
  };
  const triggerDepleted = () => {
    setSavedProg(prog);
    setDataAlert('depleted');
    setPlaying(false);
  };

  const openPizza = () => { setHungryBanner(false); setCommandeSheet(true); };

  const handleAdClick = () => { if(adPhase&&onAdPage){ const ad=getAd(adCtx); onAdPage({ad,adType:adPhase,context:adCtx,resumeProg:prog}); } };
  const skipAd = () => { setAdPhase(null); if(adPhase==='pre') setPlaying(true); };

  return (
    <div style={{background:'#000',height:'100%',position:'relative'}}>
      <Thumb id={item?.id||'n1'} style={{width:'100%',height:'100%'}}>
        <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,.35)'}}/>

        {/* Ad overlays */}
        {adPhase && (
          <AdOverlay ad={getAd(adCtx)} adType={adPhase} remaining={adRemaining}
            onSkip={skipAd} onAdClick={handleAdClick}/>
        )}

        {/* Hungry banner (mood-aware, non-blocking) */}
        {hungryBanner && !commandeSheet && (
          <div style={{position:'absolute',bottom:108,left:12,right:12,zIndex:20,background:'rgba(0,0,0,.88)',borderRadius:10,height:44,display:'flex',alignItems:'center',gap:10,padding:'0 10px',border:'1.5px solid rgba(255,107,0,.5)',animation:'slideUp .3s ease-out'}}>
            <span style={{fontSize:13,color:'#fff',flex:1,fontWeight:500}}>{hungryText(mood)}</span>
            <button onClick={openPizza} style={{background:'#FF6B00',border:'none',borderRadius:7,padding:'5px 11px',color:'#fff',fontSize:11,fontWeight:700,cursor:'pointer',flexShrink:0}}>{t('cmd_yes')}</button>
            <button onClick={()=>{setHungryBanner(false);setHungryDismissed(true);}} style={{background:'none',border:'none',color:'#666',fontSize:11,cursor:'pointer',flexShrink:0}}>{t('cmd_no')}</button>
          </div>
        )}

        {isFTV && !isFullscreen && <div style={{position:'absolute',top:46,left:16}}><span style={{background:'#FF6B00',color:'#fff',fontSize:11,fontWeight:700,padding:'4px 12px',borderRadius:20}}>FTVgo · via Max it TV</span></div>}

        {/* Bouton "← Fiche programme" — visible uniquement en plein écran */}
        {isFullscreen && (
          <button onClick={onGoToDetail} style={{position:'absolute',top:16,left:16,background:'rgba(0,0,0,.55)',border:'1px solid rgba(255,255,255,.2)',borderRadius:10,padding:'0 14px',height:36,color:'#fff',fontSize:12,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',gap:6,zIndex:6}}>
            ← Fiche programme
          </button>
        )}

        {/* Bouton fermer / exit fullscreen */}
        <button onClick={isFullscreen ? onExitFullscreen : onClose} style={{position:'absolute',top:isFullscreen?16:46,right:16,background:'rgba(255,255,255,.15)',border:'none',borderRadius:'50%',width:36,height:36,color:'#fff',fontSize:isFullscreen?14:18,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',zIndex:6}}>
          {isFullscreen
            ? <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="white" strokeWidth="1.8" strokeLinecap="round"><polyline points="5,1 5,5 1,5"/><polyline points="13,5 9,5 9,1"/><polyline points="9,13 9,9 13,9"/><polyline points="1,9 5,9 5,13"/></svg>
            : '✕'}
        </button>

        {/* Data topup confirmation */}
        {dataTopupDone && <div style={{position:'absolute',bottom:120,left:16,right:16,zIndex:25,background:'rgba(0,200,81,.9)',borderRadius:12,padding:'12px 16px',textAlign:'center',fontSize:13,fontWeight:600,color:'#fff',animation:'slideDown .3s ease-out'}}>{t('data_topup_done')}</div>}

        {/* Data low banner (non-bloquant) */}
        {isFTV && dataAlert==='low' && !dataSheet && (
          <div style={{position:'absolute',bottom:110,left:12,right:12,zIndex:20,background:'rgba(0,0,0,.85)',borderRadius:12,padding:'11px 14px',display:'flex',gap:10,alignItems:'center',border:'1.5px solid #FF6B00'}}>
            <button onClick={()=>setDataAlert(null)} style={{background:'none',border:'none',color:'#555',fontSize:16,cursor:'pointer',flexShrink:0,padding:0}}>✕</button>
            <span style={{fontSize:18,flexShrink:0}}>⚠️</span>
            <div style={{flex:1,fontSize:12,color:'#fff',lineHeight:1.4}}>{t('data_low_banner')}</div>
            <button onClick={()=>setDataSheet(true)} style={{background:'#FF6B00',border:'none',borderRadius:8,padding:'6px 12px',color:'#fff',fontSize:12,fontWeight:700,cursor:'pointer',flexShrink:0}}>{t('data_low_topup')}</button>
          </div>
        )}

        {/* Data depleted overlay (bloquant) */}
        {isFTV && dataAlert==='depleted' && !dataSheet && (
          <div style={{position:'absolute',inset:0,zIndex:35,background:'rgba(0,0,0,.92)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'24px 20px'}}>
            <span style={{fontSize:52,marginBottom:16}}>📵</span>
            <div style={{fontSize:20,fontWeight:800,color:'#fff',marginBottom:8}}>{t('data_depleted')}</div>
            <div style={{fontSize:13,color:'#888',textAlign:'center',marginBottom:28,lineHeight:1.5}}>{t('data_depleted_sub')}</div>
            {DATA_PACKS.map(p=>(
              <div key={p.id} style={{width:'100%',maxWidth:340,background:'#1a1a1a',borderRadius:12,padding:'12px 16px',marginBottom:8,display:'flex',justifyContent:'space-between',alignItems:'center',border:'1px solid #2a2a2a'}}>
                <span style={{fontSize:14,fontWeight:600,color:'#fff'}}>{p.label}</span>
                <span style={{fontSize:13,fontWeight:700,color:'#FF6B00'}}>{fmt(p.price)} XOF</span>
              </div>
            ))}
            <button onClick={()=>setDataSheet(true)} style={{width:'100%',maxWidth:340,marginTop:12,padding:'15px',borderRadius:12,border:'none',background:'#FF6B00',color:'#fff',fontSize:15,fontWeight:700,cursor:'pointer',marginBottom:10}}>
              {t('data_topup_continue')}
            </button>
            <button onClick={()=>{ onOpenPaywall && onOpenPaywall({partner:'ftvgo',title:'FTVgo',preselectedDur:'30d',forceData:'avec'}); }} style={{background:'none',border:'none',color:'#666',fontSize:11,cursor:'pointer',textDecoration:'underline',maxWidth:300,textAlign:'center',lineHeight:1.5}}>{t('data_switch_ftv')}</button>
          </div>
        )}

        {/* AfterCard at 95% */}
        {showAfter && !commandeSheet && (
          <AfterCard mood={mood} item={item} onClose={()=>{setShowAfter(false);setAfterDismissed(true);}} onOpenPaywall={onOpenPaywall}/>
        )}
        {/* Post-delivery push */}
        {showPDP && !pdpDismissed && !commandeSheet && (
          <PostDeliveryBanner mood={mood} onOrder={()=>{setShowPDP(false);setCommandeSheet(true);}} onDismiss={()=>{setShowPDP(false);setPdpDismissed(true);}}/>
        )}

        {/* Pizza tracking banner */}
        {pizzaBanner && pizzaOrderData && (
          <div onClick={()=>setPizzaSheet(true)} style={{position:'absolute',bottom:108,left:12,right:12,zIndex:20,background:'rgba(0,0,0,.88)',borderRadius:12,padding:'10px 14px',display:'flex',gap:10,alignItems:'center',border:'1.5px solid #FF6B00',cursor:'pointer',animation:'slideUp .3s ease-out'}}>
            <span style={{fontSize:18,flexShrink:0}}>🍕</span>
            <div style={{flex:1,fontSize:12,fontWeight:600,color:'#fff'}}>{pizzaBannerTexts[pizzaTrackStep]}</div>
            <div style={{fontSize:11,color:'#FF6B00',fontWeight:700}}>→</div>
          </div>
        )}

        <button onClick={()=>setPlaying(p=>!p)} style={{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)',background:'rgba(255,255,255,.15)',border:'none',borderRadius:'50%',width:66,height:66,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <span style={{color:'#fff',fontSize:26}}>{playing?'⏸':'▶'}</span>
        </button>
        <div style={{position:'absolute',bottom:0,left:0,right:0,padding:'0 16px 32px'}}>
          <div style={{fontSize:14,fontWeight:600,color:'#fff',marginBottom:10}}>{item?.title}</div>
          <div style={{height:4,background:'rgba(255,255,255,.25)',borderRadius:2,marginBottom:7}}><div style={{width:`${prog}%`,height:'100%',background:'#FF6B00',borderRadius:2,transition:'width .5s linear'}}/></div>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:14}}><span style={{fontSize:12,color:'#ccc'}}>{fmtT(cur)}</span><span style={{fontSize:12,color:'#888'}}>{fmtT(TOTAL_SEC)}</span></div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div style={{width:32}}/>
            <div style={{display:'flex',gap:36}}>
              {['⏮','▶','⏭'].map((ic,i)=>(
                <button key={i} onClick={()=>{if(i===1)setPlaying(p=>!p);}} style={{background:'none',border:'none',color:'#fff',fontSize:24,cursor:'pointer'}}>{i===1?(playing?'⏸':'▶'):ic}</button>
              ))}
            </div>
            <button onClick={isFullscreen ? onExitFullscreen : onEnterFullscreen} style={{background:'none',border:'none',cursor:'pointer',color:'#fff',padding:4,display:'flex',alignItems:'center',justifyContent:'center'}}>
              {isFullscreen
                ? <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="white" strokeWidth="1.6" strokeLinecap="round"><polyline points="6,1 6,6 1,6"/><polyline points="15,6 10,6 10,1"/><polyline points="10,15 10,10 15,10"/><polyline points="1,10 6,10 6,15"/></svg>
                : <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="white" strokeWidth="1.6" strokeLinecap="round"><polyline points="1,6 1,1 6,1"/><polyline points="10,1 15,1 15,6"/><polyline points="15,10 15,15 10,15"/><polyline points="6,15 1,15 1,10"/></svg>}
            </button>
          </div>
        </div>
      </Thumb>

      {/* Bottom sheet data recharge */}
      {dataSheet && <DataSheet onClose={()=>setDataSheet(false)} onConfirm={handleDataTopup} onSwitchFtv={()=>{ setDataSheet(false); onOpenPaywall && onOpenPaywall({partner:'ftvgo',title:'FTVgo'}); }}/>}

      {/* Bottom sheet commande */}
      {commandeSheet && (
        <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,.7)',zIndex:30,display:'flex',flexDirection:'column',justifyContent:'flex-end'}}>
          <div onClick={e=>e.stopPropagation()} style={{background:'#111',borderRadius:'20px 20px 0 0',padding:'12px 20px 36px',animation:'slideUp .3s ease-out',maxHeight:'92%',overflowY:'auto'}}>
            <CommandeSheet onClose={()=>setCommandeSheet(false)} mood={mood} noOM={noOM}/>
          </div>
        </div>
      )}
    </div>
  );
};

/* ─────────────────────────────────────────────────────────────
   SCREEN 10b — VERTICAL PLAYER (NWTV / Séries verticales)
───────────────────────────────────────────────────────────── */
const VerticalPlayer = ({items,startIdx,onClose,profile,onAdPage}) => {
  const [idx,         setIdx]        = useState(startIdx||0);
  const [liked,       setLiked]      = useState({});
  const [touchY,      setTouchY]     = useState(null);
  const [prog,        setProg]       = useState(0);
  const [playing,     setPlaying]    = useState(false);
  const [adPhase,     setAdPhase]    = useState(null);
  const [adRemaining, setAdRemaining]= useState(0);
  const [shareToast,  setShareToast] = useState(false);
  const [commentToast,setCommentToast]=useState(false);
  const [navHint,     setNavHint]    = useState(true);
  const item = items[idx];
  const showAds = (profile==='C');

  useEffect(()=>{ setProg(0); setPlaying(false); setAdPhase(showAds?'pre':null); setAdRemaining(showAds?15:0); setNavHint(true); },[idx]);

  useEffect(()=>{
    if(adPhase!=='pre') return;
    setAdRemaining(15);
    const i=setInterval(()=>setAdRemaining(r=>{if(r<=1){clearInterval(i);return 0;}return r-1;}),1000);
    return ()=>clearInterval(i);
  },[adPhase,idx]);

  useEffect(()=>{
    if(!playing||adPhase) return;
    const dur = item.dur ? parseInt(item.dur)||60 : 60;
    const i=setInterval(()=>setProg(p=>Math.min(p+(100/(dur*10)),100)),100);
    return ()=>clearInterval(i);
  },[playing,adPhase,idx]);

  useEffect(()=>{
    if(!navHint) return;
    const t=setTimeout(()=>setNavHint(false),3000);
    return()=>clearTimeout(t);
  },[navHint]);

  const handleTouchStart = e => setTouchY(e.touches[0].clientY);
  const handleTouchEnd = e => {
    if(touchY===null) return;
    const dy = touchY - e.changedTouches[0].clientY;
    if(dy>60 && idx<items.length-1) setIdx(i=>i+1);
    else if(dy<-60 && idx>0) setIdx(i=>i-1);
    setTouchY(null);
  };

  const doShare = () => { setShareToast(true); setTimeout(()=>setShareToast(false),2000); };
  const doComment = () => { setCommentToast(true); setTimeout(()=>setCommentToast(false),2500); };

  const isExternal = item.partner && item.partner !== 'core';

  return (
    <div onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd} style={{background:'#000',height:'100%',position:'relative',overflow:'hidden'}}>
      <Thumb id={item.id} style={{width:'100%',height:'100%'}}>
        <div style={{position:'absolute',inset:0,background:'linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.1) 45%,transparent 70%)'}}/>

        {/* Ad pre-roll */}
        {adPhase==='pre' && (
          <AdOverlay ad={getAd(AD_CTX(item))} adType="pre" remaining={adRemaining}
            onSkip={()=>{setAdPhase(null);setPlaying(true);}}
            onAdClick={()=>onAdPage&&onAdPage({ad:getAd(AD_CTX(item)),adType:'pre',context:AD_CTX(item)})}/>
        )}

        <button onClick={onClose} style={{position:'absolute',top:46,right:16,background:'rgba(255,255,255,.15)',border:'none',borderRadius:'50%',width:36,height:36,color:'#fff',fontSize:18,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',zIndex:6}}>✕</button>
        <div style={{position:'absolute',top:48,left:16,background:'rgba(0,0,0,.5)',borderRadius:12,padding:'3px 10px',zIndex:4}}>
          <span style={{fontSize:11,color:'#fff'}}>{idx+1}/{items.length}</span>
        </div>
        {item.live && <div style={{position:'absolute',top:46,left:60,zIndex:4}}><LiveBadge/></div>}

        {/* Play/pause tap zone */}
        {!adPhase && <button onClick={()=>setPlaying(p=>!p)} style={{position:'absolute',top:'40%',left:'50%',transform:'translate(-50%,-50%)',background:'rgba(255,255,255,.15)',border:'none',borderRadius:'50%',width:56,height:56,color:'#fff',fontSize:22,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',zIndex:4}}>{playing?'⏸':'▶'}</button>}

        <div style={{position:'absolute',bottom:52,left:16,right:72,zIndex:4}}>
          <div style={{fontSize:17,fontWeight:700,color:'#fff',marginBottom:5}}>{item.title}</div>
          <div style={{fontSize:12,color:'rgba(255,255,255,.75)'}}>{item.eps ? `${item.eps} · ${item.genre}` : item.type}</div>
          {item.dur && <div style={{fontSize:11,color:'rgba(255,255,255,.5)',marginTop:3}}>{item.dur}</div>}
          {isExternal && <div style={{fontSize:11,color:'#FF6B00',marginTop:6,fontWeight:600,cursor:'pointer'}}>{t('vp_see_more')}</div>}
        </div>

        {/* Action buttons */}
        <div style={{position:'absolute',bottom:58,right:14,display:'flex',flexDirection:'column',gap:20,alignItems:'center',zIndex:4}}>
          <button onClick={()=>setLiked(l=>({...l,[idx]:!l[idx]}))} style={{background:'none',border:'none',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:3}}>
            <span style={{fontSize:26}}>{liked[idx]?'❤️':'🤍'}</span>
            <span style={{fontSize:9,color:'rgba(255,255,255,.8)'}}>{t('vp_like')}</span>
          </button>
          <button onClick={doComment} style={{background:'none',border:'none',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:3}}>
            <span style={{fontSize:26}}>💬</span>
            <span style={{fontSize:9,color:'rgba(255,255,255,.8)'}}>{t('vp_com')}</span>
          </button>
          <button onClick={doShare} style={{background:'none',border:'none',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:3}}>
            <span style={{fontSize:22}}>↗</span>
            <span style={{fontSize:9,color:'rgba(255,255,255,.8)'}}>{t('vp_share')}</span>
          </button>
        </div>

        {/* Progress bar */}
